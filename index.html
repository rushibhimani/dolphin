<script>
(function(){
  try {
    var p = JSON.parse(localStorage.getItem("dolphin-prefs") || "null");
    if (!p) { var t = localStorage.getItem("dolphin-theme"); if (t) p = {theme:t}; }
    // Default to light theme for new users (no saved preference)
    if (!p || !p.theme) { p = p || {}; p.theme = 'light'; }
    if (p) {
      if (p.theme)     document.documentElement.setAttribute("data-theme", p.theme);
      if (p.fontScale) document.documentElement.setAttribute("data-font-scale", p.fontScale);
      if (p.density)   document.documentElement.setAttribute("data-density", p.density);
    }
  } catch(e) {}
})();
</script>

             padding:8px;min-width:180px;z-index:9000;box-shadow:0 8px 32px rgba(0,0,0,.22)">
          <div id="userMenuName" style="padding:8px 12px 10px;font-size:13px;font-weight:600;

          <button onclick="authLogout()" class="umenu-item" style="color:#DC2626">↩ Sign out</button>
        </div>
