      <div style="display:flex;justify-content:space-between;align-items:center">
        <span>Operations</span>
        <button class="btn btn-secondary" style="font-size:11px;padding:4px 9px;text-transform:none;letter-spacing:0" onclick="addOpRow()">+ Add Step</button>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);padding:4px 8px 6px;border-bottom:1px solid var(--border);margin-bottom:6px">
      <span>Name → Machine → Setup(min) → Work(min) | ⚡=Formula mode</span>
      <span style="font-size:10px">☑ = Optional step</span>
    </div>
    <div id="opsContainer"></div>
    <div id="opsEmpty" style="${routingOps.length?'display:none':''}color:var(--muted);font-size:12px;padding:8px 0">No operations yet. Click "+ Add Step".</div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" id="saveRoutingBtn" onclick="saveRouting(${r?.id??'null'})">Save Routing</button>`,
    true
  );
  setTimeout(()=>{
    attachValidation('r_name',[{test:v=>v.length>0,msg:'Routing name is required'}],'r_name_err');
    attachValidation('r_lead',[{test:v=>!isNaN(parseFloat(v))&&parseFloat(v)>=0,msg:'Must be 0 or more days'}],'r_lead_err');
    renderOpRows();
  },50);
}

function renderOpRows(){
  const c=document.getElementById('opsContainer');
  const e=document.getElementById('opsEmpty');
  if(e) e.style.display=routingOps.length?'none':'';
  if(!c) return;

  const FTYPES={
    'Fixed':                         'Fixed (constant time)',
    'Volume Milling':                'Volume Milling — L×W×Depth / MRR',
    'Perimeter Milling Single Side': 'Perimeter Milling Single Side — Dim×Depth / MRR',
    'Perimeter Milling Full':        'Perimeter Milling Full — 2×(L+W)×(T-8)/0.3/Feed',
    'Perimeter Side Milling':        'Perimeter Side Milling — 2×(L+W)×Passes / Feed',
    'Perimeter Milling':             'Perimeter Milling — 2×(L+W)×3 / Feed',
    'Perimeter Welding':             'Perimeter Welding — 2×(L+W) / 200',
    'Surface Grinding':              'Surface Grinding — Passes×(Dim+250) / 20000',
    'Sandblasting':                  'Sandblasting — L×W / MRR',
  };
  const DIMS=['length','width','thickness'];

  c.innerHTML=routingOps.map((op,i)=>{
    const hasFormula=!!(op.formula_type&&op.formula_type!=='none');
    const wMins=op.work_time_mins!=null?Math.round(op.work_time_mins):Math.round((op.work_time_hrs||0)*60);
    const ft=op.formula_type||'';
    // Which inputs each formula needs — keyed on Excel display names
    const needsDimX  = ['Volume Milling','Perimeter Milling Single Side','Surface Grinding'].includes(ft);
    const needsDimY  = ['Volume Milling','Surface Grinding'].includes(ft);
    const needsDepth = ['Volume Milling','Perimeter Milling Single Side','Perimeter Side Milling','Surface Grinding'].includes(ft);
    const needsMRR   = ['Volume Milling','Perimeter Milling Single Side','Sandblasting'].includes(ft);
    const needsFeed  = ['Perimeter Milling Full','Perimeter Side Milling','Perimeter Milling'].includes(ft);
    const needsPasses= ['Perimeter Side Milling'].includes(ft);
    const isStepMilling = ft === 'Perimeter Milling Full';  // depth = T-8 auto from thickness

    // Formula preview string — uses Excel display names
    let preview='';
    if(hasFormula&&ft&&ft!=='Fixed'){
      const dx=(op.dim_x_source||'length').slice(0,1).toUpperCase();
      const dy=(op.dim_y_source||'width').slice(0,1).toUpperCase();
      const d=op.depth_mm||'?'; const r=op.mrr||'?';
      if(ft==='Volume Milling')                preview=`(${dx}×${dy}×${d}) ÷ ${r}`;
      else if(ft==='Perimeter Milling Single Side') preview=`${dx}×${d}×T ÷ ${r}`;
      else if(ft==='Perimeter Milling Full')    preview=`2×(L+W)÷0.3×(T-8)÷Feed`;
      else if(ft==='Perimeter Side Milling')   preview=`2×(L+W)×${d} passes ÷ Feed`;
      else if(ft==='Perimeter Milling')        preview=`2×(L+W)×3 ÷ 250`;
      else if(ft==='Perimeter Welding')        preview=`2×(L+W) ÷ 200`;
      else if(ft==='Surface Grinding')         preview=`(${dy}+50)×${d}×2÷2.5 × (${dx}+250)÷20000`;
      else if(ft==='Sandblasting')             preview=`L×W ÷ ${r}`;
    } else if(hasFormula&&ft==='Fixed') preview='Fixed time — enter Work(min) above';

    return `
    <div style="border:1px solid var(--border);border-radius:7px;margin-bottom:6px;overflow:hidden">

      <!-- TOP ROW: move, seq, name, machine, setup, work/formula-toggle, opt, remove -->
      <div style="display:flex;align-items:center;gap:6px;padding:7px 8px;background:var(--card)">
        <div class="op-ed-arrows" style="display:flex;flex-direction:column;gap:1px">
          <button onclick="moveOp(${i},-1)" ${i===0?'disabled':''} style="font-size:9px;padding:1px 4px;line-height:1.2">▲</button>
          <button onclick="moveOp(${i},1)"  ${i===routingOps.length-1?'disabled':''} style="font-size:9px;padding:1px 4px;line-height:1.2">▼</button>
        </div>
        <span style="font-size:11px;color:var(--muted);font-family:var(--mono);flex-shrink:0;width:16px;text-align:center">${i+1}</span>
        <input id="oped_name_${i}" value="${op.name||''}" placeholder="Operation name" style="flex:2 1 130px;min-width:90px">
        <select id="oped_wc_${i}" style="flex:2 1 140px;min-width:110px">${buildMachineOpts(op.work_center_id)}</select>
        <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:1px">
          <span style="font-size:9px;color:var(--muted)">Setup</span>
          <input type="number" id="oped_setup_${i}" value="${op.setup_time_mins??0}" min="0" step="5" style="width:54px">
        </div>
        ${hasFormula
          ? `<div style="flex:1 1 auto;font-size:11px;color:var(--accent);font-family:var(--mono);padding:0 4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${preview}">${preview||'Formula set'}</div>`
          : `<div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:1px">
               <span style="font-size:9px;color:var(--muted)">Work(min)</span>
               <input type="number" id="oped_work_${i}" value="${wMins}" min="0" step="10" style="width:64px">
             </div>`
        }
        <label style="font-size:10px;color:var(--muted);white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:3px;flex-shrink:0">
          <input type="checkbox" id="oped_useformula_${i}" ${hasFormula?'checked':''}
            onchange="toggleOpFormula(${i},this.checked)"
            style="accent-color:var(--accent);width:12px;height:12px"> ⚡
        </label>
        <input type="checkbox" id="oped_opt_${i}" ${op.is_optional?'checked':''} title="Optional step" style="width:13px;height:13px;accent-color:var(--amber);flex-shrink:0">
        <button onclick="removeOp(${i})" title="Remove step" style="flex-shrink:0;background:none;border:none;color:var(--red);font-size:14px;cursor:pointer;padding:2px 4px;line-height:1">✕</button>
      </div>

      <!-- BOTTOM ROW: formula params — only shown when formula ON -->
      <div id="oped_formula_${i}" style="${hasFormula?'':'display:none'}background:var(--surface);border-top:1px solid var(--border);padding:8px 12px;display:${hasFormula?'grid':'none'};grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-items:end">

        <div class="form-group" style="margin:0">
          <div class="fld-label" style="font-size:10px">Formula Type</div>
          <select id="oped_ftype_${i}" style="font-size:12px" onchange="syncRoutingOps();renderOpRows()">
            <option value="">— select —</option>
            ${Object.entries(FTYPES).map(([v,l])=>`<option value="${v}" ${ft===v?'selected':''}>${l}</option>`).join('')}
          </select>
        </div>

        ${needsDimX?`<div class="form-group" style="margin:0">
          <div class="fld-label" style="font-size:10px">${ft==='Perimeter Milling Single Side'?'Cut Direction (Dim)':ft==='Surface Grinding'?'Dim X (pass direction — L or W)':'Dim X (length axis)'}</div>
          <select id="oped_dimx_${i}" style="font-size:12px">
            ${DIMS.map(d=>`<option value="${d}" ${op.dim_x_source===d?'selected':''}>${d.charAt(0).toUpperCase()+d.slice(1)}</option>`).join('')}
          </select>
        </div>`:''}

        ${needsDimY?`<div class="form-group" style="margin:0">
          <div class="fld-label" style="font-size:10px">${ft==='Surface Grinding'?'Dim Y (traverse axis — W or T)':'Dim Y (width axis)'}</div>
          <select id="oped_dimy_${i}" style="font-size:12px">
            ${DIMS.map(d=>`<option value="${d}" ${op.dim_y_source===d?'selected':''}>${d.charAt(0).toUpperCase()+d.slice(1)}</option>`).join('')}
          </select>
        </div>`:''}

        ${needsDepth?`<div class="form-group" style="margin:0">
          <div class="fld-label" style="font-size:10px">${needsPasses?'Passes':'Depth (mm)'}</div>
          <input type="number" id="oped_depth_${i}" value="${op.depth_mm||''}" min="0" step="0.5" placeholder="${needsPasses?'e.g. 10 passes':'e.g. 5'}" style="font-size:12px">
        </div>`:''}

        ${needsFeed?`<div class="form-group" style="margin:0">
          <div class="fld-label" style="font-size:10px">Feed Rate (mm/min)</div>
          <input type="number" id="oped_feed_${i}" value="${op.feed_rate||(ft==='Perimeter Milling Full'?1000:250)}" min="1" step="50" placeholder="${ft==='Perimeter Milling Full'?'e.g. 1000':'e.g. 250'}" style="font-size:12px">
        </div>`:''}

        ${needsMRR?`<div class="form-group" style="margin:0">
          <div class="fld-label" style="font-size:10px">MRR (mm³/min)</div>
          <input type="number" id="oped_mrr_${i}" value="${op.mrr||''}" min="0" step="100" placeholder="e.g. 6300" style="font-size:12px">
        </div>`:''}
        ${isStepMilling?`<div style="font-size:10px;color:var(--muted);align-self:center;padding:4px 0">
          Depth = T − 8 mm (auto from thickness at order time). Step-over = 0.3 mm fixed.
        </div>`:''}

        ${ft==='Fixed'?`<div style="font-size:11px;color:var(--muted);align-self:center;padding:4px 0">
          Fixed time — enter minutes in the Work(min) field above. No auto-calculation.
        </div>`:''}

        ${ft&&ft!=='Fixed'?`<div style="font-size:10px;color:var(--accent);align-self:center;padding:4px 0;font-style:italic">
          ${ft==='Volume Milling'?'Time = DimX × DimY × Depth / MRR':
            ft==='Perimeter Milling Single Side'?'Time = Dim × Depth × T / MRR':
            ft==='Perimeter Milling Full'?'Time = 2×(L+W) ÷ 0.3 × (T−8) ÷ Feed Rate  (Depth auto-computed as T−8)':
            ft==='Perimeter Side Milling'?'Time = 2×(L+W) × Passes / Feed':
            ft==='Perimeter Milling'?'Time = 2×(L+W) × 3 ÷ Feed Rate':
            ft==='Perimeter Welding'?'Time = 2×(L+W) / 200':
            ft==='Surface Grinding'?'Time = (DimY+50)×Depth×2/2.5 × (DimX+250)/20000  [DimX=pass direction, DimY=traverse direction]':
            ft==='Sandblasting'?'Time = L × W / MRR':''}
        </div>`:''}

      </div>

      <!-- SUB-OPS SECTION -->
      <div id="oped_subops_${i}" style="background:var(--surface2);border-top:1px solid var(--border);padding:8px 12px">
        ${(op.sub_operations||[]).length > 0 ? `
          <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px">
            Sub-operations · machine &amp; setup shared from above · work times summed for scheduling
          </div>
          ${(op.sub_operations||[]).map((s,si)=>renderSubOpRow(i,si,s,FTYPES,DIMS)).join('')}
        ` : ''}
        <button onclick="addSubOp(${i})" style="font-size:11px;padding:3px 10px;border:1px dashed var(--border);border-radius:5px;background:none;color:var(--muted);cursor:pointer;margin-top:${(op.sub_operations||[]).length?'4px':'0'}">
          + Add sub-operation
        </button>
        ${(op.sub_operations||[]).length>0?`
          <span style="font-size:11px;color:var(--muted);margin-left:12px">
            Total work: <b>${(op.sub_operations||[]).filter(s=>!s.is_optional).reduce((a,s)=>a+(s.work_time_mins||0),0).toFixed(1)} min</b>
            ${(op.sub_operations||[]).some(s=>s.is_optional)?'(+ optional)':''}
          </span>
        `:''}
      </div>

    </div>`;
  }).join('');
}

function renderSubOpRow(oi, si, s, FTYPES, DIMS){
  const ft = s.formula_type||'';
  const needsDimX  = ['Volume Milling','Perimeter Milling Single Side','Surface Grinding'].includes(ft);
  const needsDimY  = ['Volume Milling','Surface Grinding'].includes(ft);
  const needsDepth = ['Volume Milling','Perimeter Milling Single Side','Perimeter Side Milling','Surface Grinding'].includes(ft);
  const needsMRR   = ['Volume Milling','Perimeter Milling Single Side','Sandblasting'].includes(ft);
  const needsFeed  = ['Perimeter Milling Full','Perimeter Side Milling','Perimeter Milling'].includes(ft);
  const hasFormula = !!ft && ft !== 'none';
  const wMins = s.work_time_mins != null ? Math.round(s.work_time_mins) : 0;

  return `<div style="border:1px solid var(--border);border-radius:6px;margin-bottom:5px;overflow:hidden;margin-left:12px">
    <div style="display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--card)">
      <span style="font-size:10px;color:var(--muted);flex-shrink:0;width:18px;text-align:center">${si+1}</span>
      <input id="sop_name_${oi}_${si}" value="${s.name||''}" placeholder="Sub-op name"
        style="flex:2 1 120px;min-width:80px;font-size:12px">
      ${hasFormula
        ? `<span style="flex:1;font-size:10px;color:var(--accent);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ft}</span>`
        : `<div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:1px">
             <span style="font-size:9px;color:var(--muted)">Work(min)</span>
             <input type="number" id="sop_work_${oi}_${si}" value="${wMins}" min="0" step="5" style="width:60px;font-size:12px">
           </div>`
      }
      <label style="font-size:10px;color:var(--muted);white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:3px;flex-shrink:0">
        <input type="checkbox" id="sop_formula_${oi}_${si}" ${hasFormula?'checked':''}
          onchange="toggleSubOpFormula(${oi},${si},this.checked)"
          style="accent-color:var(--accent);width:12px;height:12px"> ⚡
      </label>
      <label style="font-size:10px;color:var(--amber);white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:3px;flex-shrink:0" title="Optional — can be excluded per order">
        <input type="checkbox" id="sop_opt_${oi}_${si}" ${s.is_optional?'checked':''}
          style="accent-color:var(--amber);width:12px;height:12px"> opt
      </label>
      <button onclick="removeSubOp(${oi},${si})" style="background:none;border:none;color:var(--red);font-size:12px;cursor:pointer;padding:1px 3px;line-height:1;flex-shrink:0">✕</button>
    </div>
    ${hasFormula?`
    <div style="background:var(--surface);border-top:1px solid var(--border);padding:6px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;align-items:end">
      <div class="form-group" style="margin:0">
        <div class="fld-label" style="font-size:10px">Formula Type</div>
        <select id="sop_ftype_${oi}_${si}" style="font-size:11px" onchange="syncRoutingOps();renderOpRows()">
          <option value="">— select —</option>
          ${Object.entries(FTYPES).map(([v,l])=>`<option value="${v}" ${ft===v?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>
      ${needsDimX?`<div class="form-group" style="margin:0">
        <div class="fld-label" style="font-size:10px">Dim X</div>
        <select id="sop_dimx_${oi}_${si}" style="font-size:11px">
          ${DIMS.map(d=>`<option value="${d}" ${s.dim_x_source===d?'selected':''}>${d.charAt(0).toUpperCase()+d.slice(1)}</option>`).join('')}
        </select>
      </div>`:''}
      ${needsDimY?`<div class="form-group" style="margin:0">
        <div class="fld-label" style="font-size:10px">${ft==='Surface Grinding'?'Dim Y (traverse — W or T)':'Dim Y'}</div>
        <select id="sop_dimy_${oi}_${si}" style="font-size:11px">
          ${DIMS.map(d=>`<option value="${d}" ${s.dim_y_source===d?'selected':''}>${d.charAt(0).toUpperCase()+d.slice(1)}</option>`).join('')}
        </select>
      </div>`:''}
      ${needsDepth?`<div class="form-group" style="margin:0">
        <div class="fld-label" style="font-size:10px">Depth (mm)</div>
        <input type="number" id="sop_depth_${oi}_${si}" value="${s.depth_mm||''}" min="0" step="0.5" placeholder="e.g. 10" style="font-size:11px">
      </div>`:''}
      ${needsFeed?`<div class="form-group" style="margin:0">
        <div class="fld-label" style="font-size:10px">Feed Rate (mm/min)</div>
        <input type="number" id="sop_feed_${oi}_${si}" value="${s.feed_rate||250}" min="1" step="50" style="font-size:11px">
      </div>`:''}
      ${needsMRR?`<div class="form-group" style="margin:0">
        <div class="fld-label" style="font-size:10px">MRR (mm³/min)</div>
        <input type="number" id="sop_mrr_${oi}_${si}" value="${s.mrr||''}" min="0" step="100" placeholder="e.g. 6300" style="font-size:11px">
      </div>`:''}
    </div>`:''}
  </div>`;
}

function toggleOpFormula(i, on){
  syncRoutingOps();
  if(on && (!routingOps[i].formula_type||routingOps[i].formula_type==='none'||routingOps[i].formula_type==='volume_milling')){
    routingOps[i].formula_type='Volume Milling';
    routingOps[i].dim_x_source='length';
    routingOps[i].dim_y_source='width';
  }
  if(!on) routingOps[i].formula_type=null;
  renderOpRows();
}

function toggleSubOpFormula(oi, si, on){
  syncRoutingOps();
  const s = (routingOps[oi].sub_operations||[])[si];
  if(!s) return;
  s.formula_type = on ? 'Perimeter Milling Single Side' : null;
  if(on){ s.dim_x_source='length'; s.dim_y_source='thickness'; }
  renderOpRows();
}

function addSubOp(oi){
  syncRoutingOps();
  if(!routingOps[oi].sub_operations) routingOps[oi].sub_operations=[];
  routingOps[oi].sub_operations.push({
    name:'', formula_type:null, mrr:null, depth_mm:null, feed_rate:null,
    dim_x_source:null, dim_y_source:null, work_time_mins:0, is_optional:false
  });
  renderOpRows();
}

function removeSubOp(oi, si){
  syncRoutingOps();
  routingOps[oi].sub_operations.splice(si,1);
  renderOpRows();
}

function syncRoutingOps(){
  routingOps=routingOps.map((op,i)=>{
    const useFormula=document.getElementById(`oped_useformula_${i}`)?.checked;
    const ftype=document.getElementById(`oped_ftype_${i}`)?.value||null;
    const hasSubs = (op.sub_operations||[]).length > 0;
    let wMins=0;
    if(hasSubs){
      // work time = sum of sub-ops (read-only, auto-calculated)
      wMins = (op.sub_operations||[]).reduce((a,s)=>a+(s.work_time_mins||0),0);
    } else if(useFormula&&ftype){
      wMins=0; // calculated at order time from dimensions
    } else {
      wMins=parseFloat(document.getElementById(`oped_work_${i}`)?.value)||0;
    }

    // Sync sub-ops from DOM
    const syncedSubs = (op.sub_operations||[]).map((s,si)=>{
      const useFm = document.getElementById(`sop_formula_${i}_${si}`)?.checked??!!s.formula_type;
      const sftype = useFm?(document.getElementById(`sop_ftype_${i}_${si}`)?.value||s.formula_type):null;
      const sw = useFm ? 0 : (parseFloat(document.getElementById(`sop_work_${i}_${si}`)?.value)||0);
      return {
        ...s,
        id:           s.id||null,
        name:         document.getElementById(`sop_name_${i}_${si}`)?.value?.trim()||s.name,
        formula_type: sftype||null,
        mrr:          parseFloat(document.getElementById(`sop_mrr_${i}_${si}`)?.value)||null,
        depth_mm:     parseFloat(document.getElementById(`sop_depth_${i}_${si}`)?.value)||null,
        feed_rate:    parseFloat(document.getElementById(`sop_feed_${i}_${si}`)?.value)||null,
        dim_x_source: document.getElementById(`sop_dimx_${i}_${si}`)?.value||null,
        dim_y_source: document.getElementById(`sop_dimy_${i}_${si}`)?.value||null,
        work_time_mins: sw,
        work_time_hrs:  sw/60,
        is_optional:  !!document.getElementById(`sop_opt_${i}_${si}`)?.checked,
      };
    });

    return {
      ...op,
      name:           document.getElementById(`oped_name_${i}`)?.value?.trim()||op.name,
      work_center_id: parseInt(document.getElementById(`oped_wc_${i}`)?.value)||op.work_center_id,
      setup_time_mins:parseFloat(document.getElementById(`oped_setup_${i}`)?.value)||0,
      work_time_mins: wMins,
      work_time_hrs:  wMins/60,
      is_optional:    !!document.getElementById(`oped_opt_${i}`)?.checked,
      formula_type:   useFormula?(ftype||null):null,
      mrr:            parseFloat(document.getElementById(`oped_mrr_${i}`)?.value)||null,
      depth_mm:       parseFloat(document.getElementById(`oped_depth_${i}`)?.value)||null,
      feed_rate:      parseFloat(document.getElementById(`oped_feed_${i}`)?.value)||null,
      dim_x_source:   document.getElementById(`oped_dimx_${i}`)?.value||null,
      dim_y_source:   document.getElementById(`oped_dimy_${i}`)?.value||null,
      sub_operations: syncedSubs,
    };
  });
}

function moveOp(i,dir){
  syncRoutingOps();
  const j=i+dir;
  if(j<0||j>=routingOps.length) return;
  [routingOps[i],routingOps[j]]=[routingOps[j],routingOps[i]];
  renderOpRows();
}
function addOpRow(){syncRoutingOps();routingOps.push({name:'',work_center_id:allMachines[0]?.id,setup_time_mins:0,work_time_mins:0,work_time_hrs:0,is_optional:false,sub_operations:[]});renderOpRows();}
function removeOp(i){syncRoutingOps();routingOps.splice(i,1);renderOpRows();}

async function saveRouting(editId){
  syncRoutingOps();
  if(!validateAll(['r_name','r_lead'])){toast('Fix highlighted fields','error');return;}
  if(routingOps.some(o=>!o.name.trim())){toast('All operations must have a name','error');return;}

  const skillIds = [...document.querySelectorAll('.skill-chk:checked')].map(el=>parseInt(el.value));

    role: document.getElementById('w_role').value.trim(),
    phone: document.getElementById('w_phone').value.trim(),

async function saveLeave(workerId, andReschedule=false){
  if(!validateAll(['lv_date'])){toast('Date is required','error');return;}
  const ltype = document.getElementById('lv_type').value;
  const data = {
    date: document.getElementById('lv_date').value,
    type: ltype,
    start_time: ltype==='hours' ? document.getElementById('lv_start').value : null,
    end_time:   ltype==='hours' ? document.getElementById('lv_end').value : null,
    reason: document.getElementById('lv_reason').value,
  };
  const btnId = andReschedule ? 'saveRescheduleBtn' : 'saveLeaveBtn';
  setLoading(btnId, true);
  try{
    await api('POST',`/api/workers/${workerId}/leaves`, data);
    if(andReschedule){
      const r = await api('POST',`/api/workers/${workerId}/reschedule-after-leave`);
      toast(`Leave saved. ${r.rescheduled} conflicting ops reassigned.`);
    }else{
      toast('Leave saved!');
    }
    closeModal(); showPage('workers');
  }catch(e){ toast(e.message,'error'); }
  finally{ setLoading(btnId, false); }
}

async function saveLeaveAndReschedule(workerId){ await saveLeave(workerId, true); }

async function deleteLeave(leaveId, workerName, workerId){

}

function openCustomerModal(editId){
  const c = editId ? allCustomers.find(x=>x.id===editId) : null;
  showModal(c?`Edit — ${c.name}`:'New Customer',`
    <div class="form-row cols-2">
      <div class="form-group">

async function saveCustomer(editId){
  if(!validateAll(['c_name'])){toast('Name is required','error');return;}
  const data = {
    name: document.getElementById('c_name').value.trim(),
    phone: document.getElementById('c_phone').value.trim(),
    contact_person: document.getElementById('c_contact').value.trim(),
    notes: document.getElementById('c_notes').value.trim(),
  };
  setLoading('saveCustomerBtn',true);
  try{
    if(editId&&editId!=='null') await api('PUT',`/api/customers/${editId}`,data);
    else await api('POST','/api/customers',data);
    toast('Customer saved!');
    closeModal(); await loadAll(); showPage('customers');
  }catch(e){toast(e.message,'error');}
  finally{setLoading('saveCustomerBtn',false);}
}

async function delCustomer(id){
  const c = allCustomers.find(x=>x.id===id);
  const msg = c?.job_count>0
    ? `${c.name} has ${c.job_count} jobs. Mark as inactive (jobs preserved)?`
    : 'Delete this customer?';
  const ok = await confirm2(msg, c?.job_count>0?'Mark Inactive':'Delete');
  if(!ok) return;
  try{await api('DELETE',`/api/customers/${id}`);toast('Done');await loadAll();showPage('customers');}
  catch(e){toast(e.message,'error');}
}

  const machineLoadHtml = r.machine_load.length ? r.machine_load.map((m,i)=>{
    const pct = Math.min(100, (m.hours/200)*100);  // 200hrs max for visualization
    const col = m.hours>180?'var(--red)':m.hours>120?'var(--accent)':'var(--accent2)';

      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">

    </div>`;

  // Monthly chart

  if(!allOrders.length){

      <div class="card"><div class="empty">No orders yet.<br>An order = one customer request for multiple identical pieces.<br>Each piece is scheduled independently — urgent small orders jump ahead of large slow ones automatically.</div></div>`;
    return;
  }

  const sorted = [...allOrders].sort((a,b)=>new Date(a.due_date)-new Date(b.due_date));
  document.getElementById('content').innerHTML=`
    <div style="display:flex;flex-direction:column;gap:12px">
      ${sorted.map(o=>orderCardHTML(o)).join('')}

function orderCardHTML(o){

  const isLate   = o.is_late;
  const dueColor = isLate ? 'var(--red)' : new Date(o.due_date) < new Date(Date.now()+3*86400000) ? 'var(--amber)' : 'var(--text-soft)';

  const statusBadge = o.status==='completed' ? `<span class="badge badge-done">Done</span>` :
                      o.status==='in_progress' ? `<span class="badge badge-inprog">In Progress</span>` :
                      `<span class="badge badge-pending">Pending</span>`;

  return `<div class="card">
    <div class="card-hdr" style="flex-wrap:wrap;gap:10px">
      <div style="min-width:0;flex:1">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:3px">
          <span class="mono" style="font-size:14px;font-weight:600;color:var(--accent)">${o.order_number}</span>
          ${statusBadge}
          ${isLate?'<span class="badge badge-late">LATE</span>':''}
        </div>
        <div style="font-size:13px;font-weight:500">${o.customer_name} · ${o.product_type} ${o.product_size||''} ${o.product_variant||''}</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;align-items:center">
        <button class="btn btn-secondary" style="font-size:12px;padding:5px 10px" onclick="viewOrderPieces(${o.id})">View Pieces</button>
        <button class="btn btn-secondary" style="font-size:12px;padding:5px 10px" onclick="scheduleOrder(${o.id})">⚡ Schedule</button>
        <button class="btn btn-danger" style="font-size:12px;padding:5px 10px" onclick="deleteOrder(${o.id})">Delete</button>
      </div>
    </div>
    <div class="card-body" style="padding:12px 20px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px">
        <div><div style="font-size:11px;color:var(--muted);margin-bottom:2px">Quantity</div><div class="mono" style="font-size:16px;font-weight:600">${total} pcs</div></div>
        <div><div style="font-size:11px;color:var(--muted);margin-bottom:2px">Due date</div><div class="mono" style="font-size:14px;color:${dueColor}">${fmtD(o.due_date)}${isLate?' ⚠':''}</div></div>
        <div><div style="font-size:11px;color:var(--muted);margin-bottom:2px">Est. finish</div><div class="mono" style="font-size:14px;color:${o.est_finish&&isLate?'var(--red)':'var(--muted)'}">${o.est_finish?fmtD(o.est_finish):'Not scheduled'}</div></div>
        <div><div style="font-size:11px;color:var(--muted);margin-bottom:2px">Value</div><div class="mono" style="font-size:14px;color:var(--green)">${fmtINR(o.total_price)}</div></div>
      </div>
      <div style="margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px">
          <span style="color:var(--muted)">
            ${done} done · ${inprog} in progress · ${sched} scheduled · ${total-done-inprog-sched} pending
          </span>
          <span class="mono" style="font-weight:600">${pct}%</span>
        </div>
        <div class="prog-bar" style="height:8px">
          <div class="prog-fill" style="width:${pct}%;background:${pct===100?'var(--green)':inprog>0?'var(--accent)':'var(--accent2)'}"></div>
        </div>
      </div>
    </div>
  </div>`;
}

async function scheduleOrder(orderId){
  try{
    const r = await api('POST',`/api/orders/${orderId}/schedule`);
    toast(`Scheduled ${r.scheduled} pieces${r.failed>0?' · '+r.failed+' failed':''}`);
    await loadAll();
    showPage('orders');
  }catch(e){ toast(e.message,'error'); }
}

async function deleteOrder(orderId){
  const ok = await confirm2('Delete this order and all its piece jobs? This cannot be undone.','Delete Order');
  if(!ok) return;
  try{
    await api('DELETE',`/api/orders/${orderId}`);
    toast('Order deleted');
    await loadAll();
    showPage('orders');
  }catch(e){ toast(e.message,'error'); }
}

// ── Bulk override all pieces of an order ──
async function bulkOverrideOrder(orderId){
  const order = allOrders.find(o=>o.id==orderId);
  if(!order) return;
  if(!order.routing_id){ toast('Order has no routing — cannot bulk edit','error'); return; }
  const rt = await api('GET',`/api/routings/${order.routing_id}`);
  // populate jobFormOps from routing
  jobFormOps = rt.operations.map(op=>({
    operation_id: op.id, name: op.name, wc_name: op.work_center_name,
    work_center_id: op.work_center_id, machine_type: op.machine_type||'',
    setup_time_mins: op.setup_time_mins,
    work_time_mins: op.work_time_mins!=null?op.work_time_mins:(op.work_time_hrs||0)*60,
    work_time_hrs: op.work_time_hrs, is_optional: op.is_optional, included: true
  }));
  showModal(`Edit Times — All Pieces of ${order.order_number}`,
    `<div style="font-size:12px;color:var(--muted);margin-bottom:12px;padding:8px 12px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:6px">
      ⚠ This will apply new times to <strong>all pending/scheduled pieces</strong>. In-progress and completed pieces are not affected. Jobs will be reset to pending and need rescheduling.
    </div>
    <div id="jobOpsWrap"></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" id="bulkOverrideBtn" onclick="doBulkOverride(${orderId})">Apply to All Pieces</button>`,
    true
  );
  setTimeout(()=>renderJobOpsTable(), 50);
}

async function doBulkOverride(orderId){
  const ovs = jobFormOps.map((op,i)=>({
    operation_id: op.operation_id,
    setup_time_mins: parseFloat(document.getElementById(`opsetup_${i}`)?.value)||op.setup_time_mins||0,
    work_time_mins: parseFloat(document.getElementById(`opwork_${i}`)?.value)||(op.work_time_mins||(op.work_time_hrs||0)*60),
    work_time_hrs: (parseFloat(document.getElementById(`opwork_${i}`)?.value)||(op.work_time_mins||(op.work_time_hrs||0)*60))/60,
    included: document.getElementById(`opchk_${i}`)?.checked??true,
  }));
  setLoading('bulkOverrideBtn',true);
  try{
    const r = await api('POST',`/api/orders/${orderId}/bulk-override`,{op_overrides:ovs});
    toast(`Applied to ${r.updated} pieces${r.skipped_active?' ('+r.skipped_active+' active skipped)':''}`);
    closeModal(); await loadAll(); showPage('jobs');
  }catch(e){ toast(e.message,'error'); }
  finally{ setLoading('bulkOverrideBtn',false); }
}

async function loadOrderOps(){
  const rid = parseInt(document.getElementById('ord_routing')?.value);
  if(!rid){ orderFormOps=[]; return; }
  const rt = await api('GET',`/api/routings/${rid}`);
  orderFormOps = rt.operations.map(op=>{
    const subs = (op.sub_operations||[]).map(s=>({
      id:            s.id,
      name:          s.name,
      formula_type:  s.formula_type || null,
      mrr:           s.mrr          ?? null,
      depth_mm:      s.depth_mm     ?? null,
      feed_rate:     s.feed_rate    ?? null,
      dim_x_source:  s.dim_x_source || null,
      dim_y_source:  s.dim_y_source || null,
      work_time_mins: s.work_time_mins || 0,
      is_optional:   s.is_optional,
      included:      !s.is_optional, // optional sub-ops excluded by default
    }));
    // If sub-ops exist, work_time_mins = sum of included (non-optional) sub-ops
    const hasSubs = subs.length > 0;
    const subTotal = hasSubs ? subs.filter(s=>s.included).reduce((a,s)=>a+(s.work_time_mins||0),0) : null;
    return {
      operation_id:    op.id,
      name:            op.name,
      wc_name:         op.work_center_name,
      work_center_id:  op.work_center_id,
      machine_type:    op.machine_type||'',
      setup_time_mins: op.setup_time_mins,
      work_time_mins:  hasSubs ? subTotal : (op.work_time_mins!=null ? op.work_time_mins : (op.work_time_hrs||0)*60),
      work_time_hrs:   hasSubs ? subTotal/60 : (op.work_time_hrs||0),
      is_optional:     op.is_optional,
      included:        true,
      formula_type:    op.formula_type  || null,
      mrr:             op.mrr           ?? null,
      depth_mm:        op.depth_mm      ?? null,
      feed_rate:       op.feed_rate     ?? null,
      dim_x_source:    op.dim_x_source  || null,
      dim_y_source:    op.dim_y_source  || null,
      sub_operations:  subs,
    };
  });

  // Show punch calc panel whenever product type is a punch type
  const ptype = document.getElementById('ord_ptype')?.value||'';
  const punchCalcPanel = document.getElementById('punchCalcPanel');
  if(punchCalcPanel) punchCalcPanel.style.display = ptype.toLowerCase().includes('punch') ? '' : 'none';

  renderOrderOpsTable();
  triggerEstimate();
}

// ── Punch dimension calculator ──
async function calcPunchTimes(){
  const L = parseFloat(document.getElementById('ord_length')?.value)||0;
  const W = parseFloat(document.getElementById('ord_width')?.value)||0;
  const T = parseFloat(document.getElementById('ord_thickness')?.value)||35;

  if(!L||!W){toast('Enter length and width first','error');return;}
  if(!orderFormOps.length){toast('Select a routing template first','error');return;}

  // Send the CURRENT routing ops to the API — it calculates times using each op's
  // own formula_type, mrr, and depth_mm. Does NOT replace ops with a hardcoded list.
  const payload = {
    length: L, width: W, thickness: T,
    routing_ops: orderFormOps.map(op=>({
      operation_id:    op.operation_id||null,
      name:            op.name,
      formula_type:    op.formula_type||'fixed',
      mrr:             op.mrr||null,
      depth_mm:        op.depth_mm||null,
      feed_rate:       op.feed_rate||null,
      dim_x_source:    op.dim_x_source||null,
      dim_y_source:    op.dim_y_source||null,
      setup_time_mins: op.setup_time_mins||0,
      machining_mins:  op.work_time_mins||0,
      work_center_id:  op.work_center_id||null,
      included:        op.included!==false,
      sub_operations:  (op.sub_operations||[]).map(s=>({
        id:            s.id||null,
        name:          s.name,
        formula_type:  s.formula_type||'fixed',
        mrr:           s.mrr||null,
        depth_mm:      s.depth_mm||null,
        feed_rate:     s.feed_rate||null,
        dim_x_source:  s.dim_x_source||null,
        dim_y_source:  s.dim_y_source||null,
        work_time_mins:s.work_time_mins||0,
        is_optional:   s.is_optional||false,
        included:      s.included!==false,
      })),
    }))
  };

  try{
    const r = await api('POST','/api/punch-calc', payload);

    // Update times IN PLACE — match by operation_id to avoid index mismatch
    // r.ops mirrors the routing_ops we sent, so same length and order
    if(r.ops.length !== orderFormOps.length){
      toast('Formula result mismatch — please re-select routing template','error');
      return;
    }
    orderFormOps = orderFormOps.map((existing, i)=>{
      const calcOp = r.ops[i];
      // Also update sub-op times if returned
      let updatedSubs = existing.sub_operations || [];
      if(calcOp.sub_operations && calcOp.sub_operations.length === updatedSubs.length){
        updatedSubs = updatedSubs.map((s, si)=>({
          ...s,
          work_time_mins: calcOp.sub_operations[si].work_time_mins,
          work_time_hrs:  calcOp.sub_operations[si].work_time_mins / 60,
        }));
      }
      return {
        ...existing,
        work_time_mins:  calcOp.work_time_mins,
        work_time_hrs:   calcOp.work_time_mins / 60,
        _formula_desc:   calcOp.formula_desc,
        sub_operations:  updatedSubs,
      };
    });

    renderOrderOpsTable();
    triggerEstimate();
    toast(`Calculated ${r.ops.length} ops · total ${Math.round(r.total_mins)} min (${r.total_hrs.toFixed(1)} h)`);
  }catch(e){toast(e.message,'error');}
}

function renderOrderOpsTable(){
  if(!orderFormOps.length){ document.getElementById('ordOpsWrap').innerHTML='<div style="color:var(--muted);font-size:12px">No operations</div>'; return; }
  const rows = orderFormOps.map((op,i)=>{
    const hasSubs = (op.sub_operations||[]).length > 0;
    const wMins = hasSubs
      ? (op.sub_operations||[]).filter(s=>s.included!==false).reduce((a,s)=>a+(s.work_time_mins||0),0)
      : (op.work_time_mins!=null ? op.work_time_mins : (op.work_time_hrs||0)*60);
    const sMins = op.setup_time_mins||0;
    const hasFormula = !hasSubs && op.formula_type && op.formula_type!=='none';
    const formulaBadge = hasFormula
      ? `<span style="font-size:10px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:1px 5px;margin-left:4px" title="${op._formula_desc||op.formula_type}">⚡ formula</span>`
      : hasSubs ? `<span style="font-size:10px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:3px;padding:1px 5px;margin-left:4px">${(op.sub_operations||[]).length} sub-ops</span>` : '';
    const wcOpts = allMachines.map(m=>`<option value="${m.id}" ${op.work_center_id==m.id?'selected':''}>${m.name}</option>`).join('');

    // Sub-op rows (indented) — shown if any sub-ops defined
    const subRows = hasSubs ? (op.sub_operations||[]).map((s,si)=>{
      const sInc = s.included!==false;
      const sOpt = s.is_optional;
      const sFmBadge = s.formula_type
        ? `<span style="font-size:9px;background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:1px 4px;margin-left:3px">⚡</span>` : '';
      return `<tr style="background:var(--surface2);${sInc?'':'opacity:.45'}">
        <td style="padding-left:24px">
          ${sOpt?`<input type="checkbox" ${sInc?'checked':''} onchange="toggleSubOrderOp(${i},${si},this.checked)" style="width:12px;height:12px;accent-color:var(--amber)" title="Optional — toggle to include/exclude">`:'<span style="display:inline-block;width:12px">·</span>'}
        </td>
        <td class="mono" style="color:var(--muted);font-size:10px;text-align:center">${i+1}.${si+1}</td>
        <td colspan="3" style="font-size:11px;color:var(--fg);padding-left:8px">
          ${sOpt?'<span style="color:var(--amber);font-size:9px;margin-right:4px">opt</span>':''}${s.name}${sFmBadge}
        </td>
        <td style="font-size:11px;color:var(--muted);text-align:center">${Math.round(s.work_time_mins||0)}</td>
        <td style="font-size:11px;color:var(--muted);text-align:right">${fmtTotal(s.work_time_mins||0)}</td>
      </tr>`;
    }).join('') : '';

    return `<tr id="ooprow_${i}" class="${op.included?'':'excluded'}">
      <td><input type="checkbox" id="oopchk_${i}" ${op.included?'checked':''} onchange="toggleOrderOp(${i},this.checked)" style="width:14px;height:14px;accent-color:var(--accent)"></td>
      <td class="mono" style="color:var(--muted);text-align:center;font-size:11px">${i+1}</td>
      <td style="font-size:12px;font-weight:500">${op.name}${formulaBadge}</td>
      <td><select id="oopwc_${i}" onchange="updateOrderOpWC(${i},this.value)" style="font-size:11px;min-width:120px">${wcOpts}</select></td>
      <td><input type="number" id="oopsetup_${i}" value="${Math.round(sMins)}" min="0" step="5" onchange="recalcOrderOp(${i})" ${op.included?'':'disabled'} style="width:60px"></td>
      <td><input type="number" id="oopwork_${i}"  value="${Math.round(wMins)}" min="0" step="10" onchange="recalcOrderOp(${i})" ${op.included&&!hasSubs?'':'disabled'} style="width:70px" ${hasSubs?'title="Auto-sum of sub-operations"':hasFormula?'title="Auto-calculated — edit to override"':''}></td>
      <td style="font-size:11px;color:var(--muted);text-align:right" id="ooptot_${i}">${fmtTotal(sMins+wMins)}</td>
    </tr>${subRows}`;
  }).join('');
  document.getElementById('ordOpsWrap').innerHTML=`
    <table class="op-ov-table">
      <thead><tr><th>✓</th><th>#</th><th>Operation</th><th>Machine</th><th>Setup(min)</th><th>Work(min)</th><th>Total</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function toggleSubOrderOp(oi, si, checked){
  if(!orderFormOps[oi].sub_operations) return;
  orderFormOps[oi].sub_operations[si].included = checked;
  // Recalc parent work time
  const newTotal = orderFormOps[oi].sub_operations.filter(s=>s.included!==false).reduce((a,s)=>a+(s.work_time_mins||0),0);
  orderFormOps[oi].work_time_mins = newTotal;
  orderFormOps[oi].work_time_hrs = newTotal/60;
  renderOrderOpsTable();
  debounceEstimate();
}

function updateOrderOpWC(i, wcId){
  orderFormOps[i].work_center_id = parseInt(wcId);
  const m = allMachines.find(x=>x.id==wcId);
  if(m) orderFormOps[i].wc_name = m.name;
}

function toggleOrderOp(i,checked){
  orderFormOps[i].included=checked;
  document.getElementById(`ooprow_${i}`).className=checked?'':'excluded';
  [`oopsetup_${i}`,`oopwork_${i}`].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=!checked;});
  debounceEstimate();
}
function recalcOrderOp(i){
  const s=parseFloat(document.getElementById(`oopsetup_${i}`)?.value)||0;
  const w=parseFloat(document.getElementById(`oopwork_${i}`)?.value)||0;
  orderFormOps[i].setup_time_mins=s; orderFormOps[i].work_time_mins=w; orderFormOps[i].work_time_hrs=w/60;
  const el=document.getElementById(`ooptot_${i}`); if(el) el.textContent=fmtTotal(s+w);
  debounceEstimate();
}

let _estTimer=null;
function debounceEstimate(){ clearTimeout(_estTimer); _estTimer=setTimeout(triggerEstimate,600); }
function triggerEstimate(){
  clearTimeout(_estTimer);
  const rid=parseInt(document.getElementById('ord_routing')?.value);
  const qty=parseInt(document.getElementById('ord_qty')?.value)||1;
  if(!rid||!orderFormOps.length){ return; }
  runEstimate(rid, qty);
}

async function runEstimate(routingId, qty){
  const el=document.getElementById('estimateContent');
  if(!el) return;
  el.innerHTML=`<div style="color:var(--muted);font-size:12px">Calculating…</div>`;
  try{
    const ovs = orderFormOps.map((op,i)=>({
      operation_id: op.operation_id,
      setup_time_mins: parseFloat(document.getElementById(`oopsetup_${i}`)?.value)||op.setup_time_mins||0,
      work_time_mins:  parseFloat(document.getElementById(`oopwork_${i}`)?.value)||(op.work_time_mins||(op.work_time_hrs||0)*60),
      included: document.getElementById(`oopchk_${i}`)?.checked??op.included,
    }));
    const r = await api('POST','/api/estimate',{routing_id:routingId, quantity:Math.min(qty,20), op_overrides:ovs});
    const due = document.getElementById('ord_due')?.value;
    const dueDate = due ? new Date(due) : null;
    const finishDate = r.est_last_finish ? new Date(r.est_last_finish) : null;
    const isLate = dueDate && finishDate && finishDate > dueDate;
    const diffDays = dueDate && finishDate ? Math.round((finishDate-dueDate)/86400000) : null;

    el.innerHTML=`
      <div style="padding:10px;background:${isLate?'var(--red-soft)':'var(--accent-soft)'};border:1px solid ${isLate?'var(--red)':'var(--accent)'};border-radius:8px;margin-bottom:12px;text-align:center">
        <div style="font-size:11px;color:var(--muted);margin-bottom:2px">Est. completion (last piece)</div>
        <div style="font-size:18px;font-weight:700;color:${isLate?'var(--red)':'var(--accent)'}">${finishDate?finishDate.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—'}</div>
        ${diffDays!==null?`<div style="font-size:11px;margin-top:3px;color:${isLate?'var(--red)':'var(--green)'}">${isLate?'⚠ '+diffDays+' days LATE':'✓ '+Math.abs(diffDays)+' days buffer'}</div>`:''}
      </div>
      ${r.est_first_finish&&qty>1?`<div style="font-size:11px;color:var(--muted);margin-bottom:8px">First piece ready: <strong>${new Date(r.est_first_finish).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</strong></div>`:''}
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600">Total work: ${fmtTotal(r.total_work_mins)} per piece</div>
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px">Bottlenecks</div>
      ${r.bottlenecks.slice(0,4).map(b=>`
        <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">
          <span>${b.wc_name}</span><span class="mono">${fmtTotal(b.total_mins)}</span>
        </div>`).join('')}
      <div style="font-size:10px;color:var(--muted);margin-top:8px">Based on current machine load · ${qty>20?'Capped at 20 pieces for speed':qty+' piece'+(qty>1?'s':'')}</div>
    `;
  }catch(e){
    el.innerHTML=`<div style="color:var(--red);font-size:12px">Estimate failed: ${e.message}</div>`;
  }
}

async function saveOrder(){
  const custId   = document.getElementById('ord_cust').value;
  const ptype    = document.getElementById('ord_ptype').value;
  const sizeSel  = document.getElementById('ord_size').value;
  const size     = sizeSel==='custom'
    ? (document.getElementById('ord_size_custom')?.value||'').trim()
    : sizeSel;
  const qty      = parseInt(document.getElementById('ord_qty').value) || 1;
  const due      = document.getElementById('ord_due').value;
  const routingId= document.getElementById('ord_routing').value;

  if(!custId)    { toast('Select a customer','error');   return; }
  if(!size)      { toast('Enter product size','error');   return; }
  if(!due)       { toast('Select a due date','error');    return; }
  if(!routingId) { toast('Select a routing','error');     return; }
  if(qty < 1)    { toast('Quantity must be at least 1','error'); return; }

  const ovs = orderFormOps.map((op,i)=>({
    operation_id: op.operation_id,
    setup_time_mins: parseFloat(document.getElementById(`oopsetup_${i}`)?.value)||op.setup_time_mins||0,
    work_time_mins:  parseFloat(document.getElementById(`oopwork_${i}`)?.value)||(op.work_time_mins||(op.work_time_hrs||0)*60),
    work_time_hrs:   (parseFloat(document.getElementById(`oopwork_${i}`)?.value)||(op.work_time_mins||(op.work_time_hrs||0)*60))/60,
    included: document.getElementById(`oopchk_${i}`)?.checked??true,
  }));

  const c = allCustomers.find(x=>x.id==custId);
  const data = {
    customer_id:    parseInt(custId),
    customer_name:  c?.name || '',
    po_number:      document.getElementById('ord_po').value.trim(),
    product_type:   ptype,
    product_size:   size,
    product_variant:document.getElementById('ord_variant').value.trim(),
    quantity:       qty,
    due_date:       due + 'T08:00:00',
    routing_id:     parseInt(routingId),
    op_overrides:   ovs.length ? ovs : undefined,
    total_price:    document.getElementById('ord_price').value || null,
    priority_flag:  document.getElementById('ord_urgent').checked,
    notes:          document.getElementById('ord_notes').value,
  };

  setLoading('saveOrderBtn', true);
  try{
    const r = await api('POST', '/api/orders', data);
    toast(`Order ${r.order_number} created — ${qty} piece jobs generated`);
    closeModal(); await loadAll(); showPage('orders');
  }catch(e){ toast(e.message, 'error'); }
  finally{ setLoading('saveOrderBtn', false); }
}

async function init(){
  let connected = false;
  for(let attempt=0; attempt<3; attempt++){
    try{
      await api('GET','/api/health');
      document.getElementById('serverStatus').textContent='Connected';
      document.getElementById('statusDot').style.background='var(--green)';
      connected=true; break;
    }catch{
      document.getElementById('serverStatus').textContent=
        attempt<2?`Connecting... (${attempt+1}/3)`:'Offline';
      if(attempt<2) await new Promise(r=>setTimeout(r,1500));
    }
  }
  if(!connected){
    document.getElementById('serverStatus').textContent='Offline';
    document.getElementById('statusDot').style.background='var(--red)';
  }
  // Always try to load and show dashboard regardless of connection state
  try{ await loadAll(); }catch(e){ console.error('loadAll:', e); }
  // Backfill codes for existing machines/workers that don't have one
  try{ await api('POST','/api/backfill-codes'); }catch{}
  showPage('dashboard');
  // Auto-refresh dashboard every 5 minutes when idle
  setInterval(async()=>{
    if(currentPage==='dashboard'){ try{await loadAll();showPage('dashboard');}catch{} }
  }, 300000);
}

  let shifts={};
  try{ shifts=await api('GET','/api/shift-settings'); }catch(e){}

  const DAYS=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
  const DAY_LABELS={monday:'Monday',tuesday:'Tuesday',wednesday:'Wednesday',
    thursday:'Thursday',friday:'Friday',saturday:'Saturday',sunday:'Sunday'};
  const DAY_SHORT={monday:'MON',tuesday:'TUE',wednesday:'WED',
    thursday:'THU',friday:'FRI',saturday:'SAT',sunday:'SUN'};

  function calcEff(s){
    if(!s.working) return 0;
    const [sh,sm]=(s.start||'08:00').split(':').map(Number);
    const [eh,em]=(s.end||'20:00').split(':').map(Number);
    let total=(eh*60+em)-(sh*60+sm);

      const [leh,lem]=s.lunch_end.split(':').map(Number);

    return Math.max(0,total/60);

          <div style="margin-top:4px;font-size:12px;color:var(--muted)">Display preferences saved to this browser only. Working hours saved to server (shift_settings.json).</div>
          <div style="margin-top:12px"><button class="btn btn-ghost" onclick="resetPrefs()">Reset display preferences</button></div>
        </div>
      </div>

    </div>`;

  // Wire pref buttons
  document.querySelectorAll('.pref-opts').forEach(group=>{
    const key=group.getAttribute('data-pref');
    group.querySelectorAll('.pref-opt').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const val=btn.getAttribute('data-value');
        updatePref(key,val);
        group.querySelectorAll('.pref-opt').forEach(b=>b.classList.toggle('active',b===btn));
      });
    });
  });
}

function toggleDay(day){
  const card   = document.getElementById(`daycard_${day}`);
  const body   = document.getElementById(`daycard_body_${day}`);
  const effEl  = document.getElementById(`daycard_eff_${day}`);
  const knob   = document.getElementById(`toggle_knob_${day}`);
  // infer current state from knob position
  const isOn   = knob.style.left==='23px';
  const nowOn  = !isOn;
  knob.style.left       = nowOn?'23px':'3px';
  knob.parentElement.style.background = nowOn?'var(--accent)':'var(--border2)';
  body.style.opacity         = nowOn?'1':'0.4';
  body.style.pointerEvents   = nowOn?'':'none';
  // update label
  const label = knob.parentElement.previousElementSibling;
  if(label) label.textContent = nowOn?'Working':'Off';
  // enable/disable inputs
  ['start','end','ls','le'].forEach(f=>{
    const el=document.getElementById(`shift_${f}_${day}`)||document.getElementById(`shift_start_${day}`);
    // find by id pattern
  });
  ['shift_start','shift_end','shift_ls','shift_le'].forEach(pre=>{
    const el=document.getElementById(`${pre}_${day}`);
    if(el) el.disabled=!nowOn;
  });
  onShiftChange(day);
}

function onShiftChange(day){
  const DAYS=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
  const knob=document.getElementById(`toggle_knob_${day}`);
  const working=knob?knob.style.left==='23px':true;

  const start=document.getElementById(`shift_start_${day}`)?.value||'08:00';
  const end  =document.getElementById(`shift_end_${day}`)?.value||'20:00';
  const ls   =document.getElementById(`shift_ls_${day}`)?.value||'';
  const le   =document.getElementById(`shift_le_${day}`)?.value||'';
  const [sh,sm]=start.split(':').map(Number);
  const [eh,em]=end.split(':').map(Number);
  let total=(eh*60+em)-(sh*60+sm);
  if(ls&&le){const[lsh,lsm]=ls.split(':').map(Number);const[leh,lem]=le.split(':').map(Number);total-=Math.max(0,(leh*60+lem)-(lsh*60+lsm));}
  const eff=working?Math.max(0,total/60):0;

  const effEl=document.getElementById(`daycard_eff_${day}`);
  if(effEl){
    effEl.style.color=eff>0?'var(--accent)':'var(--muted)';
    effEl.textContent=working?`${eff.toFixed(1)}h net working`:'Not working';
  }

  // Update weekly total
  let weeklyTotal=0;
  DAYS.forEach(d=>{
    const k=document.getElementById(`toggle_knob_${d}`);
    const on=k?k.style.left==='23px':false;
    if(!on) return;
    const s=document.getElementById(`shift_start_${d}`)?.value||'08:00';
    const e=document.getElementById(`shift_end_${d}`)?.value||'20:00';
    const l1=document.getElementById(`shift_ls_${d}`)?.value||'';
    const l2=document.getElementById(`shift_le_${d}`)?.value||'';
    const [sh2,sm2]=s.split(':').map(Number);const[eh2,em2]=e.split(':').map(Number);
    let tot=(eh2*60+em2)-(sh2*60+sm2);
    if(l1&&l2){const[a,b]=l1.split(':').map(Number);const[c,dd]=l2.split(':').map(Number);tot-=Math.max(0,(c*60+dd)-(a*60+b));}
    weeklyTotal+=Math.max(0,tot/60);
  });
  const wtEl=document.getElementById('weeklyTotal');
  if(wtEl) wtEl.textContent=weeklyTotal.toFixed(1)+'h';
}

async function saveShiftSettings(){
  const DAYS=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
  const data={};
  DAYS.forEach(day=>{
    const knob=document.getElementById(`toggle_knob_${day}`);
    const working=knob?knob.style.left==='23px':false;
    const ls=document.getElementById(`shift_ls_${day}`)?.value||'';
    const le=document.getElementById(`shift_le_${day}`)?.value||'';
    data[day]={
      working,
      start:      document.getElementById(`shift_start_${day}`)?.value||'08:00',
      end:        document.getElementById(`shift_end_${day}`)?.value||'20:00',
      lunch_start:ls||null,
      lunch_end:  le||null,
    };
  });
  try{
    await api('PUT','/api/shift-settings',data);
    toast('Working hours saved ✓ — run Schedule All to apply');
  }catch(e){ toast(e.message,'error'); }
}

function _renderRoutingStatsContent(routings){
  const c = document.getElementById('rsContent');
  if(!routings.length){ c.innerHTML=`<div class="empty">No active routings yet.</div>`; return; }
  const groups = {};
  routings.forEach(r => { (groups[r.product_type||'Uncategorized']=groups[r.product_type||'Uncategorized']||[]).push(r); });
  const keys = Object.keys(groups).sort();
  const totalRoutings=routings.length, withData=routings.filter(r=>r.sample_count>0).length,
        totalSamples=routings.reduce((s,r)=>s+(r.sample_count||0),0);
  c.innerHTML = `
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px;font-size:13px">
      <div><span style="color:var(--muted)">Total routings:</span> <strong>${totalRoutings}</strong></div>
      <div><span style="color:var(--muted)">With data:</span> <strong>${withData}</strong></div>
      <div><span style="color:var(--muted)">Jobs analyzed:</span> <strong>${totalSamples}</strong></div>
    </div>
    ${keys.map(pt=>`
      <div style="margin-bottom:24px">
        <div style="font-weight:600;color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:6px">${escHtml(pt)}</div>
        ${groups[pt].map(r=>_routingStatsCard(r)).join('')}
      </div>`).join('')}`;
}

function _routingStatsCard(r){
  const hasData=r.sample_count>0, v=r.variance_pct;
  let varColor='var(--muted)',varText='—';
  if(v!=null){ if(v>50)varColor='var(--red)'; else if(v>20)varColor='var(--amber)'; else if(v>-20)varColor='var(--green)'; else varColor='var(--accent)'; varText=`${v>0?'+':''}${v}%`; }
  return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px">
      <div style="font-weight:600">${escHtml(r.name)}</div>
      <div style="display:flex;gap:14px;font-size:12px;flex-wrap:wrap">

        <div><span style="color:var(--muted)">Avg actual:</span> <strong>${hasData?r.avg_actual_total_hours+'h':'—'}</strong></div>
        <div><span style="color:var(--muted)">Variance:</span> <strong style="color:${varColor}">${varText}</strong></div>
        <div><span style="color:var(--muted)">Samples:</span> <strong>${r.sample_count}</strong></div>
      </div>
    </div>
    <table style="width:100%;font-size:11px;border-collapse:collapse">
      <thead><tr style="color:var(--muted);border-bottom:1px solid var(--border)">
        <th style="text-align:left;padding:4px;width:24px">#</th>
        <th style="text-align:left;padding:4px">Step</th>
        <th style="text-align:right;padding:4px;width:80px">Estimated</th>
        <th style="text-align:right;padding:4px;width:80px">Avg actual</th>
        <th style="text-align:right;padding:4px;width:70px">Variance</th>
      </tr></thead>
      <tbody>${(r.operations||[]).map(op=>`
        <tr style="border-bottom:1px solid var(--border)">
          <td style="padding:4px;color:var(--muted)">${op.sequence}</td>
          <td style="padding:4px">${escHtml(op.name)}</td>
          <td style="padding:4px;text-align:right">${op.estimated_hours}h</td>
          <td style="padding:4px;text-align:right">—</td>
          <td style="padding:4px;text-align:right;color:var(--muted)">—</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

const floorPlan = {
  machines: {}, load: {}, assignments: {}, machineStatus: {}, selected: null, showWorkers: true, timer: null,

  async fetchDetails() {
    const d = await api('GET', '/api/machines/details');
    this.machines = d;
  },

  async fetchData() {
    try {
      const [load, assign, status] = await Promise.all([
        api('GET', '/api/machines/load-today'),
        api('GET', '/api/machines/assignments/now'),
        api('GET', '/api/machines/status-today'),
      ]);
      this.load = load;
      this.assignments = assign;
      this.machineStatus = status;
      this.applyColors();
      this.applyBadges();
      if (this.selected) await this.renderDetail(this.selected);
    } catch(e) { console.warn('Floor plan update failed:', e); }
  },

  colorFor(code) {
    const st = this.machineStatus[code];
    if (st === 'breakdown') return '#3b82f6';
    if (st === 'maintenance') return '#8b5cf6';
    if (st === 'in_progress') return '#ef4444';
    if (st === 'scheduled') return '#f59e0b';
    const pct = Math.round(((this.load[code] || 0) / 10) * 100);
    if (pct > 70) return '#ef4444';
    if (pct > 30) return '#f59e0b';
    return '#22c55e';
  },

  statusLabel(code) {
    const st = this.machineStatus[code];
    if (st === 'breakdown') return 'Down';
    if (st === 'maintenance') return 'Maintenance';
    if (st === 'in_progress') return 'Running';
    if (st === 'scheduled') return 'Scheduled';
    return 'Available';
  },

  buildSVG() {
    // ViewBox 1460 x 590. Two sections split by pathway at y≈300.
    const layout = {
      'M21': {x:15,  y:100, w:90,  h:110},
      'M7':  {x:140, y:165, w:85,  h:80},
      'M8':  {x:255, y:145, w:130, h:110},
      'M9':  {x:415, y:145, w:130, h:110},
      'M10': {x:575, y:145, w:95,  h:65},
      'M20': {x:575, y:220, w:95,  h:60},
      'M11': {x:690, y:145, w:95,  h:110},
      'M12': {x:800, y:145, w:95,  h:110},
      'M13': {x:910, y:145, w:95,  h:110},
      'M14': {x:1040,y:145, w:150, h:110},
      'M17': {x:1255,y:145, w:95,  h:110},
      'M15': {x:995, y:20,  w:300, h:85},
      'M22': {x:1360,y:20,  w:85,  h:85},
      'M16': {x:1360,y:120, w:85,  h:135},
      'M6':  {x:15,  y:320, w:85,  h:130},
      'M5':  {x:15,  y:465, w:85,  h:100},
      'M4':  {x:255, y:345, w:130, h:120},
      'M3':  {x:415, y:345, w:130, h:120},
      'M2':  {x:580, y:345, w:175, h:120},
      'M1':  {x:870, y:345, w:130, h:120},
      'M19': {x:1020,y:380, w:95,  h:70},
      'M18': {x:1255,y:330, w:100, h:110},
    };

    const cell = (code) => {
      const pos = layout[code];
      if (!pos) return '';
      const { x, y, w, h } = pos;
      const d = this.machines[code] || {};
      // Full machine name — use all words, wrap at 14 chars per line
      const fullName = d.name || code;
      const words = fullName.split(' ');
      let line1 = '', line2 = '';
      for (const word of words) {
        if (!line1 || (line1 + ' ' + word).length <= 14) line1 = line1 ? line1 + ' ' + word : word;
        else { line2 = line2 ? line2 + ' ' + word : word; break; }
      }
      const fill = this.colorFor(code);
      const pct  = Math.round(((this.load[code]||0)/10)*100);
      const asgn = this.assignments[code];
      const st   = this.statusLabel(code);
      const fs   = w >= 130 ? 12 : 11;

      // Worker badge below the box
      const badge = (asgn && this.showWorkers)
        ? `<rect x="${x+w/2-22}" y="${y+h+3}" width="44" height="17" rx="3" fill="#1d4ed8" opacity="0.92"/>
           <text x="${x+w/2}" y="${y+h+15}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${asgn.worker_code}</text>`
        : '';

      const nameY1 = line2 ? y+h/2+3 : y+h/2+9;
      const codeY  = line2 ? y+h/2-14 : y+h/2-8;
      return `<g class="fp-machine" data-code="${code}" onclick="floorPlan.select('${code}')" style="cursor:pointer">
        <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${fill}" stroke="rgba(0,0,0,.2)" stroke-width="1"/>
        <text x="${x+w/2}" y="${codeY}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#fff">${code}</text>
        <text x="${x+w/2}" y="${nameY1}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" fill="rgba(255,255,255,.9)">${line1}</text>
        ${line2 ? `<text x="${x+w/2}" y="${y+h/2+17}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" fill="rgba(255,255,255,.9)">${line2}</text>` : ''}
        <text x="${x+w/2}" y="${y+h-7}" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="rgba(255,255,255,.75)">${st} · ${pct}%</text>
        ${badge}
      </g>`;
    };

    const cells = Object.keys(layout).map(cell).join('');

    // Pathway: thick grey band between rows
    const pathway = `
      <rect x="110" y="295" width="1345" height="22" rx="0" fill="var(--bg)" opacity="0.5"/>
      <line x1="110" y1="295" x2="1455" y2="295" stroke="var(--border)" stroke-width="1.5"/>
      <line x1="110" y1="317" x2="1455" y2="317" stroke="var(--border)" stroke-width="1.5"/>
      <text x="680" y="309" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="var(--muted)" letter-spacing="4">· · · · · · · · · AISLE · · · · · · · · ·</text>
      <line x1="110" y1="120" x2="110" y2="580" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.5"/>
    `;

    return `<svg id="fpSvg" viewBox="0 0 1460 590" style="width:100%;min-width:900px">
      ${pathway}
      ${cells}
    </svg>`;
  },

  applyColors() {
    document.querySelectorAll('.fp-machine').forEach(g => {
      const code = g.dataset.code;
      const rect = g.querySelector('rect');
      if (rect) rect.setAttribute('fill', this.colorFor(code));
      // Update status+pct text (last text in group)
      const texts = g.querySelectorAll('text');
      const last = texts[texts.length - 1];
      if (last && !last.dataset.worker) {
        const pct = Math.round(((this.load[code]||0)/10)*100);
        last.textContent = `${this.statusLabel(code)} · ${pct}%`;
      }
    });
  },

  applyBadges() {
    document.querySelectorAll('.fp-machine').forEach(g => {
      const code = g.dataset.code;
      // Remove old dynamic badges
      g.querySelectorAll('[data-worker]').forEach(el => el.remove());
      const asgn = this.assignments[code];
      if (asgn && this.showWorkers) {
        const ns = 'http://www.w3.org/2000/svg';
        const rect = g.querySelector('rect');
        const bx = +rect.getAttribute('x') + +rect.getAttribute('width') / 2;
        const by = +rect.getAttribute('y') + +rect.getAttribute('height');
        const bg = document.createElementNS(ns, 'rect');
        bg.setAttribute('x', bx - 22); bg.setAttribute('y', by + 3);
        bg.setAttribute('width', 44); bg.setAttribute('height', 17);
        bg.setAttribute('rx', 3); bg.setAttribute('fill', '#1d4ed8');
        bg.setAttribute('opacity', '0.92'); bg.dataset.worker = '1';
        const t = document.createElementNS(ns, 'text');
        t.setAttribute('x', bx); t.setAttribute('y', by + 15);
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('font-size', '10'); t.setAttribute('font-weight', '700');
        t.setAttribute('fill', '#fff'); t.dataset.worker = '1';
        t.textContent = asgn.worker_code;
        g.appendChild(bg); g.appendChild(t);
      }
    });

  select(code) {
    document.querySelectorAll('.fp-machine rect:first-child').forEach(r => {
      r.setAttribute('stroke', 'rgba(0,0,0,.2)');
      r.setAttribute('stroke-width', '1');
    });

    this.renderDetail(code);
  },

  async renderDetail(code) {
    const el = document.getElementById('fpDetail');

    const d = this.machines[code] || {};
    const hours = this.load[code] || 0;
    const pct = Math.round((hours / 10) * 100);

      html += `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:16px;display:flex;align-items:center;gap:12px">

      </div>`;
    }

    el.innerHTML = html + `<div id="fpOpsLoading" style="color:var(--muted);font-size:13px">Loading operations…</div>`;

    try {
      const res = await api('GET', `/api/machines/${code}/today`);
      const ops = res.ops || [];

        opsHtml += `<div style="color:var(--muted);font-size:13px;padding:8px 0">No operations scheduled for today</div>`;
      } else {
        ops.forEach(op => {
          const t = op.scheduled_start ? new Date(op.scheduled_start).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}) : '—';
          const sc = statusColor[op.status] || '#6b7280';
          const sl = statusLabel[op.status] || op.status;
          opsHtml += `<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start">
            <div style="width:8px;height:8px;border-radius:50%;background:${sc};flex-shrink:0;margin-top:5px"></div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;margin-bottom:2px">${op.job_number} · ${op.operation_name}</div>
              <div style="font-size:12px;color:var(--muted);margin-bottom:2px">${op.worker_name} · ${op.estimated_duration}h · ${t}</div>
            </div>
            <span style="font-size:10px;padding:2px 7px;border-radius:20px;background:${sc};color:#fff;font-weight:600;flex-shrink:0;margin-top:2px">${sl}</span>
          </div>`;
        });
      }
      opsHtml += `</div>`;
      document.getElementById('fpOpsLoading').outerHTML = opsHtml;
    } catch(e) {
      const el2 = document.getElementById('fpOpsLoading');
      if (el2) el2.textContent = 'Could not load operations.';
    }
  },

  toggleWorkers() {
    this.showWorkers = document.getElementById('fpWorkerToggle').checked;
    this.applyBadges();
  },

  start() { this.timer = setInterval(() => this.fetchData(), 5000); },
  stop()  { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
};

async function renderFloorPlan() {
  floorPlan.stop();
  if (Object.keys(floorPlan.machines).length === 0) {
    try { await floorPlan.fetchDetails(); } catch(e) { console.warn('Floor plan details failed:', e); }
  }
  await floorPlan.fetchData();

  document.getElementById('content').innerHTML = `
    <div style="padding:28px 32px">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px">
        <div>
          <div style="font-size:22px;font-weight:600;margin-bottom:2px">Factory Floor Plan</div>
          <div style="font-size:13px;color:var(--muted)">Live machine capacity &amp; worker assignments · auto-refresh 5s</div>
        </div>
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;color:var(--fg)">
            <input type="checkbox" id="fpWorkerToggle" ${floorPlan.showWorkers?'checked':''} onchange="floorPlan.toggleWorkers()"> Show workers
          </label>
          <button class="btn btn-secondary" onclick="floorPlan.fetchData()" style="font-size:12px;padding:5px 12px">↻ Refresh</button>
        </div>
      </div>

      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:12px">
        <div style="display:flex;align-items:center;gap:5px"><div style="width:12px;height:12px;border-radius:3px;background:#22c55e"></div>Available</div>
        <div style="display:flex;align-items:center;gap:5px"><div style="width:12px;height:12px;border-radius:3px;background:#f59e0b"></div>Scheduled</div>
        <div style="display:flex;align-items:center;gap:5px"><div style="width:12px;height:12px;border-radius:3px;background:#ef4444"></div>Running / Full</div>
        <div style="display:flex;align-items:center;gap:5px"><div style="width:12px;height:12px;border-radius:3px;background:#8b5cf6"></div>Maintenance</div>
        <div style="display:flex;align-items:center;gap:5px"><div style="width:12px;height:12px;border-radius:3px;background:#3b82f6"></div>Breakdown</div>
      </div>

      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:24px;overflow-x:auto">
        ${floorPlan.buildSVG()}
      </div>

      <div id="fpDetail" style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:20px;min-height:80px;font-size:13px;color:var(--muted)">
        Click any machine to view today's operations and worker details
      </div>
    </div>`;

  const style = document.createElement('style');
  style.id = 'fpStyle';
  document.getElementById('fpStyle')?.remove();
  style.textContent = `.fp-machine{cursor:pointer}.fp-machine:hover>rect{filter:brightness(1.1)}.fp-machine rect,.fp-machine text{transition:all .15s}`;
  document.head.appendChild(style);

  floorPlan.start();
}

</script>
</body>
</html>
