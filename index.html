<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dolphin ERP</title>
<script>
  // Apply saved prefs before paint to avoid flash
  (function(){
    try{
      var raw = localStorage.getItem('dolphin-prefs');
      var p = raw ? JSON.parse(raw) : null;
      if(!p){
        var oldT = localStorage.getItem('dolphin-theme');
        if(oldT==='light'||oldT==='dark') p = {theme:oldT};
      }
      if(p){
        if(p.theme)      document.documentElement.setAttribute('data-theme', p.theme);
        if(p.fontScale)  document.documentElement.setAttribute('data-font-scale', p.fontScale);
        if(p.density)    document.documentElement.setAttribute('data-density', p.density);
      }
    }catch(e){}
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DOLPHIN ERP — Design system
   Light + dark themes, balanced density, accessible sizing.
   Toggle via [data-theme="light"|"dark"] on <html>.
   ============================================================ */

/* DARK (default) */
:root,
:root[data-theme="dark"]{
  --bg:#0f1115;
  --surface:#171a21;
  --card:#1c2029;
  --card-hover:#222732;
  --border:#262b36;
  --border-strong:#363c4a;
  --text:#e9ecf3;
  --text-soft:#b9bfcd;
  --muted:#7a8295;
  --accent:#f59e0b;
  --accent-soft:rgba(245,158,11,.12);
  --accent-hover:#fbbf24;
  --green:#34d399;
  --green-soft:rgba(52,211,153,.12);
  --red:#f87171;
  --red-soft:rgba(248,113,113,.12);
  --amber:#fbbf24;
  --amber-soft:rgba(251,191,36,.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 12px rgba(0,0,0,.35);
  --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  --row-hover:rgba(255,255,255,.03);
}

/* LIGHT */
:root[data-theme="light"]{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --card:#ffffff;
  --card-hover:#f7f8fa;
  --border:#e5e7eb;
  --border-strong:#d1d5db;
  --text:#1d2128;
  --text-soft:#3f4654;
  --muted:#7a8295;
  --accent:#d97706;
  --accent-soft:rgba(217,119,6,.10);
  --accent-hover:#b45309;
  --green:#059669;
  --green-soft:rgba(5,150,105,.10);
  --red:#dc2626;
  --red-soft:rgba(220,38,38,.08);
  --amber:#d97706;
  --amber-soft:rgba(217,119,6,.10);
  --shadow-sm:0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 12px rgba(15,23,42,.06);
  --shadow-lg:0 16px 40px rgba(15,23,42,.12);
  --row-hover:rgba(15,23,42,.025);
}

/* Common */
:root{
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Inter','IBM Plex Sans',
         'Segoe UI',Roboto,sans-serif;
  --r-sm:6px; --r-md:8px; --r-lg:10px; --r-xl:14px;
  /* User-adjustable scaling (overridable via [data-font-scale] / [data-density]) */
  --fs-scale:1;          /* font size multiplier */
  --sp-scale:1;          /* spacing/padding multiplier */
  --fs-base:15px;        /* base font, scaled below */
  /* Aliases for legacy class names that still reference these */
  --accent2:var(--accent);
  --orange:var(--accent);
  --purple:var(--accent);
  --border2:var(--border-strong);
}
:root[data-font-scale="small"]   { --fs-scale:.92 }
:root[data-font-scale="default"] { --fs-scale:1 }
:root[data-font-scale="large"]   { --fs-scale:1.10 }
:root[data-font-scale="xlarge"]  { --fs-scale:1.22 }
:root[data-density="compact"]    { --sp-scale:.85 }
:root[data-density="comfortable"]{ --sp-scale:1 }
:root[data-density="spacious"]   { --sp-scale:1.18 }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:calc(var(--fs-base) * var(--fs-scale));
  line-height:1.5;
  min-height:100vh;
  display:flex;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
/* ===================== SIDEBAR ===================== */
.sidebar{
  width:232px;min-height:100vh;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;z-index:100;
  transition:transform .22s ease;
}
.logo{padding:20px 22px 18px;border-bottom:1px solid var(--border)}
.logo-title{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.01em}
.logo-sub{font-size:12px;color:var(--muted);margin-top:2px}
.logo-tz{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:6px}
nav{padding:10px 10px;flex:1;overflow-y:auto}
.nav-group{
  font-size:11px;font-weight:600;color:var(--muted);
  padding:14px 12px 6px;letter-spacing:.02em;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;margin:1px 0;border-radius:var(--r-sm);
  cursor:pointer;color:var(--text-soft);
  transition:background .15s, color .15s;
  font-size:14px;font-weight:500;user-select:none;
  border-left:none;
}
.nav-item:hover{background:var(--row-hover);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item svg{width:17px;height:17px;flex-shrink:0;stroke-width:1.8}
.sidebar-foot{padding:14px 22px;border-top:1px solid var(--border);flex-shrink:0}
.status-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Hamburger (mobile only) */
.menu-btn{
  display:none;background:none;border:none;color:var(--text);
  padding:8px;border-radius:var(--r-sm);cursor:pointer;margin-right:4px;
}
.menu-btn:hover{background:var(--row-hover)}
.menu-btn svg{width:22px;height:22px}
.sidebar-backdrop{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
  z-index:90;backdrop-filter:blur(2px);
}
.sidebar-backdrop.open{display:block}
/* ===================== MAIN ===================== */
.main{margin-left:232px;flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  min-height:60px;background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;position:sticky;top:0;z-index:50;gap:14px;
  flex-wrap:nowrap;
}
.topbar-title{font-size:18px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.theme-toggle{
  background:transparent;border:1px solid var(--border);
  color:var(--text-soft);padding:7px 9px;border-radius:var(--r-sm);
  cursor:pointer;display:inline-flex;align-items:center;
  transition:background .15s,color .15s;
}
.theme-toggle:hover{background:var(--row-hover);color:var(--text)}
.theme-toggle svg{width:17px;height:17px}
.content{padding:24px 28px 40px;flex:1;min-width:0}

/* ===================== STATS ===================== */
.stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;margin-bottom:22px;
}
.stat-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:18px 20px;
  box-shadow:var(--shadow-sm);
}
.stat-label{
  font-size:13px;font-weight:500;color:var(--muted);
  margin-bottom:8px;letter-spacing:0;text-transform:none;
}
.stat-value{
  font-family:var(--sans);font-size:28px;font-weight:600;
  letter-spacing:-.02em;line-height:1.1;
}
.stat-sub{font-size:12px;color:var(--muted);margin-top:4px}

/* ===================== CARD ===================== */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--shadow-sm);
}
.card-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border);gap:12px;
}
.card-title{font-size:15px;font-weight:600;white-space:nowrap;letter-spacing:-.005em}
.card-body{padding:20px}

/* ===================== BUTTONS ===================== */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:var(--r-sm);
  font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;
  transition:background .15s,border-color .15s,color .15s,transform .05s;
  font-family:var(--sans);white-space:nowrap;user-select:none;line-height:1;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn-secondary:hover{background:var(--card-hover);border-color:var(--border-strong)}
.btn-danger{background:var(--red-soft);color:var(--red);border-color:transparent}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-success{background:var(--green-soft);color:var(--green);border-color:transparent}
.btn-success:hover{background:var(--green);color:#fff}
.btn-ghost{background:transparent;color:var(--text-soft);border-color:var(--border)}
.btn-ghost:hover{background:var(--row-hover);color:var(--text)}
.btn-icon{padding:7px 9px}
.btn svg{width:14px;height:14px}
/* ===================== JOBS TABLE =====================
   Header is a flex row using the same .jcol-* classes as data rows,
   so columns line up perfectly. On narrow screens the whole thing
   horizontally scrolls inside .jobs-scroll, never bleeds past viewport. */
.jobs-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.jobs-scroll::-webkit-scrollbar{height:8px}
.jobs-scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
.jobs-table{width:100%;min-width:1130px;border-collapse:collapse}
.jobs-thead-row{
  display:flex;align-items:center;
  padding:12px 16px;
  border-bottom:1px solid var(--border);
  background:var(--card);
  position:sticky;top:0;z-index:5;
  font-size:13px;font-weight:600;color:var(--muted);
}
.jobs-thead-row .jcol{padding-right:14px}
.jobs-table tbody{display:block}
.jobs-table tr{display:block}
.jobs-table td{display:block;padding:0;border-bottom:1px solid var(--border)}
/* Customers uses standard table layout */
#customersTable{display:table;width:100%;border-collapse:collapse}
#customersTable thead{display:table-header-group}
#customersTable tbody{display:table-row-group}
#customersTable tr{display:table-row}
#customersTable td,#customersTable th{display:table-cell;padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:14px}
#customersTable th{font-size:12px;font-weight:600;color:var(--muted);background:var(--card)}
#customersTable tr:hover td{background:var(--row-hover)}
.job-main-row{
  display:flex;align-items:center;padding:13px 16px;gap:0;
  cursor:pointer;transition:background .12s;width:100%;
}
.job-main-row:hover{background:var(--row-hover)}
.job-main-row.expanded{background:var(--accent-soft)}
.jcol{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding-right:14px;font-size:14px;flex-shrink:0;
}
.jcol-num{flex:0 0 130px;font-weight:500}
.jcol-cust{flex:0 0 140px}
.jcol-prod{flex:0 0 90px;color:var(--text-soft)}
.jcol-due{flex:0 0 100px;color:var(--text-soft)}
.jcol-status{flex:0 0 100px}
.jcol-price{flex:0 0 90px;font-variant-numeric:tabular-nums}
.jcol-cr{flex:0 0 100px}
.jcol-prog{flex:1 1 90px;min-width:80px}
.jcol-actions{flex:0 0 230px;padding-right:0;text-align:right}
.jcol-actions .btn{padding:6px 10px;font-size:13px}
.jcol-actions .btn-icon{padding:6px 8px}
.expand-icon{
  width:18px;height:18px;flex-shrink:0;color:var(--muted);
  transition:transform .2s;margin-right:10px;
}
.expand-icon.open{transform:rotate(90deg);color:var(--accent)}

/* ===================== JOB DETAIL ===================== */
.job-detail-panel{
  background:var(--surface);border-top:1px solid var(--border);
  padding:18px 22px;display:none;
}
.job-detail-panel.open{display:block}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.detail-item .dl{
  font-size:12px;font-weight:500;color:var(--muted);
  margin-bottom:4px;letter-spacing:0;text-transform:none;
}
.detail-item .dv{font-size:14px}

/* ===================== OPS TIMELINE ===================== */
.ops-timeline{display:flex;flex-direction:column;gap:4px}
.op-line{
  display:grid;grid-template-columns:30px 170px 1fr 170px 110px 90px;
  gap:10px;align-items:center;padding:9px 12px;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-sm);font-size:13px;
}
.op-line.inprog{border-color:var(--accent);background:var(--accent-soft)}
.op-line.paused{border-color:var(--amber);background:var(--amber-soft);opacity:.9}
.op-line.done{opacity:.6}
/* ===================== BADGES ===================== */
.badge{
  display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:.02em;
  text-transform:uppercase;white-space:nowrap;
}
.badge-pending{background:var(--row-hover);color:var(--muted);border:1px solid var(--border)}
.badge-scheduled{background:var(--accent-soft);color:var(--accent)}
.badge-inprog{background:var(--accent-soft);color:var(--accent)}
.badge-done{background:var(--green-soft);color:var(--green)}
.badge-urgent{background:var(--red-soft);color:var(--red)}
.badge-paused{background:var(--amber-soft);color:var(--amber)}
.badge-late{background:var(--red-soft);color:var(--red);border:1px solid var(--red)}
.badge-overdue{background:var(--red);color:#fff;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.65}}
.badge-bottleneck{background:var(--amber-soft);color:var(--amber)}

/* ===================== CR BAR + PROGRESS ===================== */
.cr-bar{display:flex;align-items:center;gap:8px}
.cr-track{flex:1;height:4px;background:var(--border);border-radius:999px;overflow:hidden}
.cr-fill{height:100%;border-radius:999px}
.cr-val{font-family:var(--mono);font-size:12px;color:var(--text-soft);min-width:28px;font-variant-numeric:tabular-nums}
.prog-wrap{display:flex;flex-direction:column;gap:3px}
.prog-bar{height:4px;background:var(--border);border-radius:999px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:999px;transition:width .3s}

/* ===================== FORMS ===================== */
.form-section{
  font-size:13px;font-weight:600;color:var(--muted);
  padding:16px 0 10px;border-bottom:1px solid var(--border);
  margin-bottom:16px;letter-spacing:0;text-transform:none;
}
.form-section:first-child{padding-top:0}
.form-row{display:grid;gap:14px;margin-bottom:14px}
.form-row.cols-2{grid-template-columns:1fr 1fr}
.form-row.cols-3{grid-template-columns:1fr 1fr 1fr}
.form-row.cols-1{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:6px}
.fld-label{font-size:13px;font-weight:500;color:var(--text-soft)}
.fld-label span{color:var(--red);margin-left:2px}
input,select,textarea{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text);
  padding:9px 12px;font-size:14px;font-family:var(--sans);
  outline:none;transition:border-color .15s,box-shadow .15s;width:100%;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}
input[type=number]{-moz-appearance:textfield}
input::placeholder,textarea::placeholder{color:var(--muted)}
select option{background:var(--card);color:var(--text)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
.checkbox-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-sm);
  cursor:pointer;font-size:14px;
}
.checkbox-row input[type=checkbox]{
  width:16px;height:16px;accent-color:var(--accent);
  cursor:pointer;flex-shrink:0;
}
.info-hint{
  font-size:13px;color:var(--text-soft);
  padding:10px 12px;background:var(--accent-soft);
  border:1px solid transparent;border-radius:var(--r-sm);line-height:1.5;
}
/* ===================== MODAL ===================== */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.55);z-index:1000;
  align-items:center;justify-content:center;backdrop-filter:blur(6px);
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-xl);width:760px;max-width:97vw;max-height:94vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
}
.modal-lg{width:880px}
.modal-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.modal-title{font-size:16px;font-weight:600;letter-spacing:-.005em}
.modal-close{
  background:none;border:none;color:var(--muted);
  cursor:pointer;padding:6px 9px;border-radius:var(--r-sm);
  font-size:18px;line-height:1;
}
.modal-close:hover{color:var(--text);background:var(--row-hover)}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-footer{
  padding:14px 22px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;
}

/* ===================== OP OVERRIDE TABLE ===================== */
.op-ov-table{width:100%;border-collapse:collapse;font-size:13px}
.op-ov-table th{
  font-size:12px;font-weight:600;color:var(--muted);
  padding:8px 10px;border-bottom:1px solid var(--border);
  text-align:left;white-space:nowrap;letter-spacing:0;text-transform:none;
}
.op-ov-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.op-ov-table tr:last-child td{border-bottom:none}
.op-ov-table tr.excluded td{opacity:.4}
.op-ov-table input[type=number]{width:78px;padding:5px 7px;font-size:13px}
.op-ov-table input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent)}

/* ===================== ROUTING EDITOR ===================== */
.op-ed-row{
  display:grid;grid-template-columns:30px 30px 1fr 180px 78px 78px 44px 30px;
  gap:6px;align-items:center;padding:8px 0;
  border-bottom:1px solid var(--border);
}
.op-ed-row.hdr{
  font-size:12px;color:var(--muted);font-weight:600;
  letter-spacing:0;text-transform:none;padding-bottom:10px;
}
.op-ed-row input,.op-ed-row select{padding:6px 8px;font-size:13px}
.op-ed-seq{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.op-ed-arrows{display:flex;flex-direction:column;gap:1px}
.op-ed-arrows button{
  background:none;border:none;color:var(--muted);
  cursor:pointer;padding:1px 4px;font-size:11px;
  line-height:1;border-radius:3px;
}
.op-ed-arrows button:hover{color:var(--text);background:var(--row-hover)}
.op-rm{
  background:none;border:none;color:var(--muted);
  cursor:pointer;padding:4px;border-radius:var(--r-sm);font-size:14px;
}
.op-rm:hover{color:var(--red);background:var(--red-soft)}

/* ===================== GANTT / TODAY / HEATMAP ===================== */
#ganttWrap{
  overflow:auto;background:var(--surface);
  border-radius:var(--r-md);border:1px solid var(--border);max-height:560px;
}
.today-machine-block{margin-bottom:18px}
.today-machine-title{
  font-size:14px;font-weight:600;color:var(--text);
  padding:12px 18px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-md) var(--r-md) 0 0;
  display:flex;align-items:center;justify-content:space-between;
  letter-spacing:0;text-transform:none;
}
.today-machine-title .opcount{font-weight:500;color:var(--muted);font-size:13px}
.today-op-row{
  display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 16px;
  padding:14px 18px;
  border:1px solid var(--border);border-top:none;background:var(--card);
  font-size:14px;
}
.today-op-row:last-child{border-radius:0 0 var(--r-md) var(--r-md)}
.today-op-row.overdue{background:var(--red-soft);border-color:var(--red)}
.today-op-row.inprog{background:var(--accent-soft);border-color:var(--accent)}
.today-op-row.paused{background:var(--amber-soft);border-color:var(--amber)}
.today-op-info{flex:1 1 280px;min-width:0}
.today-op-time{
  flex:0 0 auto;font-size:13px;color:var(--text-soft);
  font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.5;
}
.today-op-status{flex:0 0 auto}
.today-op-actions{flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap}
.today-op-title{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:5px;
}
.today-op-title .jobnum{
  font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:500;
}
.today-op-title .opname{font-size:14px;font-weight:500}
.today-op-meta{font-size:13px;color:var(--muted);line-height:1.5}
.today-op-meta .worker{color:var(--accent)}
.today-op-started{font-size:12px;color:var(--green);margin-top:4px}

.hm-table{border-collapse:collapse}
.hm-table th{
  font-size:12px;font-weight:600;color:var(--muted);
  padding:8px 6px;text-align:center;white-space:nowrap;
  letter-spacing:0;text-transform:none;
}
.hm-table td{padding:3px}
.hm-cell{
  width:46px;height:46px;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;cursor:default;
  transition:opacity .15s;
}
.hm-cell:hover{opacity:.8}

/* ===================== TOAST ===================== */
#toast{
  position:fixed;bottom:24px;right:24px;
  background:var(--card);border:1px solid var(--border-strong);
  border-radius:var(--r-md);padding:13px 18px;font-size:14px;
  box-shadow:var(--shadow-lg);transform:translateY(80px);opacity:0;
  transition:all .25s;z-index:9999;max-width:340px;pointer-events:none;
}
#toast.show{transform:translateY(0);opacity:1}
#toast.success{border-color:var(--green)}
#toast.error{border-color:var(--red)}

/* ===================== CONFIRM ===================== */
.confirm-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:2000;align-items:center;justify-content:center;backdrop-filter:blur(4px);
}
.confirm-overlay.open{display:flex}
.confirm-box{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-xl);padding:26px;width:360px;box-shadow:var(--shadow-lg);
}
.confirm-msg{font-size:15px;margin-bottom:22px;line-height:1.5}
.confirm-actions{display:flex;justify-content:flex-end;gap:10px}

/* ===================== DATETIME ===================== */
.dt-field{
  display:flex;gap:0;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-sm);
  overflow:hidden;transition:border-color .15s,box-shadow .15s;width:100%;
}
.dt-field:focus-within{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
.dt-field input[type=date],.dt-field input[type=time]{
  background:transparent;border:none;border-radius:0;outline:none;
  padding:9px 12px;font-size:14px;color:var(--text);font-family:var(--mono);
  box-shadow:none;
}
.dt-field input[type=date]{flex:1;min-width:0;border-right:1px solid var(--border)}
.dt-field input[type=time]{width:100px;flex-shrink:0}
.dt-field input[type=date]:focus,.dt-field input[type=time]:focus{box-shadow:none}
.dt-field input::-webkit-calendar-picker-indicator{filter:invert(0.5);cursor:pointer;opacity:.6}
:root[data-theme="light"] .dt-field input::-webkit-calendar-picker-indicator{filter:none}
.dt-field input::-webkit-calendar-picker-indicator:hover{opacity:1}

/* ===================== VALIDATION ===================== */
.field-err{font-size:12px;color:var(--red);margin-top:4px;display:none}
.field-err.show{display:block}
input.invalid,select.invalid,textarea.invalid{
  border-color:var(--red)!important;background:var(--red-soft);
}
input.valid,select.valid{border-color:var(--green)}

/* ===================== MISC ===================== */
.btn-loading{opacity:.7;pointer-events:none;cursor:not-allowed}
.btn-loading::after{content:' ⏳'}
.gantt-view-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;font-size:13px;font-weight:500;
  cursor:pointer;border:none;background:transparent;
  color:var(--text-soft);font-family:var(--sans);
  transition:background .15s,color .15s;border-radius:var(--r-sm);
}
.gantt-view-btn:hover{color:var(--text);background:var(--row-hover)}
.gantt-view-btn.active{color:var(--accent);background:var(--accent-soft)}
.empty{text-align:center;padding:40px 28px;color:var(--muted);font-size:14px}
.warn-box{
  display:flex;align-items:flex-start;gap:10px;
  padding:11px 14px;background:var(--red-soft);
  border:1px solid var(--red);border-radius:var(--r-sm);
  font-size:13px;color:var(--red);margin-bottom:14px;line-height:1.5;
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ===================== SETTINGS / PREFERENCES ===================== */
.pref-row{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:18px;padding:18px 0;border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.pref-row:first-child{padding-top:0}
.pref-row:last-child{border-bottom:none;padding-bottom:0}
.pref-info{flex:1 1 240px;min-width:0}
.pref-label{font-size:15px;font-weight:600;margin-bottom:4px}
.pref-help{font-size:13px;color:var(--muted);line-height:1.5}
.pref-opts{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:3px;flex-shrink:0;flex-wrap:wrap}
.pref-opt{
  background:transparent;border:none;color:var(--text-soft);
  padding:8px 14px;font-size:13px;font-weight:500;
  border-radius:var(--r-sm);cursor:pointer;font-family:var(--sans);
  transition:background .15s,color .15s;
}
.pref-opt:hover{color:var(--text)}
.pref-opt.active{background:var(--accent);color:#fff}

/* ===================== RESPONSIVE ===================== */
@media (max-width:980px){
  .menu-btn{display:inline-flex}
  .sidebar{transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .topbar{padding:0 16px;height:56px}
  .topbar-title{font-size:17px;overflow:hidden;text-overflow:ellipsis}
  .content{padding:18px 16px 32px}
  .stats-grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .stat-card{padding:14px 16px}
  .stat-value{font-size:24px}
  .modal{border-radius:var(--r-md)}
  .detail-grid{grid-template-columns:repeat(2,1fr)}
  .op-line{grid-template-columns:30px 1fr;gap:6px}
  .op-line>*:nth-child(n+3){grid-column:2}
}
@media (max-width:640px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .stat-value{font-size:22px}
  .form-row.cols-2,.form-row.cols-3{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
  .modal-body,.modal-hdr,.modal-footer{padding-left:16px;padding-right:16px}
  .topbar-actions{gap:4px}
  .topbar-actions .btn{padding:7px 10px;font-size:12px}
  .card-hdr{flex-wrap:wrap}
  /* Today op row stacks completely on phone */
  .today-op-time{flex-basis:100%;font-size:12px}
  .today-op-status{flex-basis:auto}
  .today-op-actions{flex-basis:100%;justify-content:flex-start}
  /* Hide secondary topbar info on small screens to prevent overlap */
  #todayTs{display:none}
  /* Settings page on phone */
  .pref-row{flex-direction:column;align-items:stretch;gap:10px}
}
</style>
</head>

<script>
const API='http://localhost:8000';
let allMachines=[],allRoutings=[],allJobs=[],allCustomers=[],allWorkers=[],allOrders=[];
let currentPage='dashboard';
let routingOps=[],jobFormOps=[];
let confirmResolve=()=>{};

// ── PREFERENCES (theme, font scale, density) ──
const PREFS_KEY='dolphin-prefs';
const DEFAULT_PREFS={theme:'dark',fontScale:'default',density:'comfortable',timeUnit:'minutes'};
function loadPrefs(){
  try{
    const raw=localStorage.getItem(PREFS_KEY);
    if(raw) return Object.assign({},DEFAULT_PREFS,JSON.parse(raw));
  }catch(e){}
  try{
    const oldT=localStorage.getItem('dolphin-theme');
    if(oldT==='light'||oldT==='dark') return Object.assign({},DEFAULT_PREFS,{theme:oldT});
  }catch(e){}
  return Object.assign({},DEFAULT_PREFS);
}

// ── TIME DISPLAY HELPERS ──
// getTimeUnit() returns 'minutes' or 'hours'
function getTimeUnit(){return loadPrefs().timeUnit||'minutes';}
// fmtWork: display work time (input in minutes)
function fmtWork(mins){
  if(!mins&&mins!==0) return '—';
  if(getTimeUnit()==='hours'){
    const h=mins/60; return h%1===0?`${h}h`:`${h.toFixed(1)}h`;
  }
  return `${Math.round(mins)}min`;
}
// fmtSetup: setup time always in minutes (small values)
function fmtSetup(mins){
  if(!mins&&mins!==0) return '—';
  if(getTimeUnit()==='hours'){
    const h=mins/60; return h%1===0?`${h}h`:`${h.toFixed(1)}h`;
  }
  return `${Math.round(mins)}min`;
}
// fmtTotal: total time in minutes, display per pref
function fmtTotal(totalMins){
  if(getTimeUnit()==='hours'){
    const h=totalMins/60; return `${h.toFixed(1)}h`;
  }
  return `${Math.round(totalMins)}min`;
}
// Time unit label for column headers
function timeUnitLabel(){return getTimeUnit()==='hours'?'hrs':'min';}
function savePrefs(p){try{localStorage.setItem(PREFS_KEY,JSON.stringify(p));}catch(e){}}
function applyPrefs(p){
  document.documentElement.setAttribute('data-theme',p.theme);
  document.documentElement.setAttribute('data-font-scale',p.fontScale);
  document.documentElement.setAttribute('data-density',p.density);
  // Sync theme icon
  const sun=document.getElementById('themeIconSun');
  const moon=document.getElementById('themeIconMoon');
  if(sun&&moon){
    const isLight=p.theme==='light';
    sun.style.display=isLight?'':'none';
    moon.style.display=isLight?'none':'';
  }
  savePrefs(p);
}
function getPrefs(){return loadPrefs();}
function updatePref(key,value){
  const p=getPrefs(); p[key]=value; applyPrefs(p);
}

// ── THEME TOGGLE ──
function applyTheme(t){updatePref('theme',t);}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')||'dark';
  applyTheme(cur==='dark'?'light':'dark');
}

// ── SIDEBAR (mobile) ──
function openSidebar(){
  document.querySelector('.sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('open');
}
function closeSidebar(){
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}

document.addEventListener('DOMContentLoaded', function(){
  // Apply saved preferences (theme, font, density)
  applyPrefs(loadPrefs());
  const tg = document.getElementById('themeToggle');
  if(tg) tg.addEventListener('click', toggleTheme);
  const mb = document.getElementById('menuBtn');
  if(mb) mb.addEventListener('click', openSidebar);
  const bd = document.getElementById('sidebarBackdrop');
  if(bd) bd.addEventListener('click', closeSidebar);
  // Close sidebar when a nav item is tapped on mobile
  document.querySelectorAll('.sidebar .nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{ if(window.innerWidth<=980) closeSidebar(); });
  });
  // Esc closes sidebar/modal
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape'){ closeSidebar(); }
  });
});

// ── UTILS ──
function toast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className=`show ${type}`;setTimeout(()=>t.className='',3200)}

function confirm2(msg,btnLabel='Delete'){
  return new Promise(res=>{
    document.getElementById('confirmMsg').textContent=msg;
    document.getElementById('confirmOkBtn').textContent=btnLabel;
    document.getElementById('confirmOverlay').classList.add('open');

async function api(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body!==undefined) opts.body=JSON.stringify(body);
  try{
    const r=await fetch(API+path,opts);
    if(!r.ok){
      const e=await r.json().catch(()=>({detail:`HTTP ${r.status}`}));
      const err=new Error(e.detail||`HTTP ${r.status}`);
      console.error(`API ${method} ${path} failed:`,err.message);
      throw err;
    }
    return r.json();
  }catch(e){
    if(e.name==='TypeError') console.error(`API ${method} ${path}: Network error (server down?)`);
    throw e;
  }
}

// ── VALIDATION ENGINE ──
// Attach blur validation to a field
// rules: array of {test: fn(value)=>bool, msg: string}
function attachValidation(fieldId, rules, errId) {
  const field = document.getElementById(fieldId);
  const errEl = document.getElementById(errId);
  if (!field || !errEl) return;

  function validate() {
    const val = field.value.trim();
    for (const rule of rules) {
      if (!rule.test(val, field)) {
        field.classList.add('invalid'); field.classList.remove('valid');
        errEl.textContent = rule.msg; errEl.classList.add('show');
        return false;
      }
    }
    field.classList.remove('invalid'); field.classList.add('valid');
    errEl.classList.remove('show');
    return true;
  }

  field.addEventListener('blur', validate);
  // Re-validate on input after first error shown
  field.addEventListener('input', () => {
    if (field.classList.contains('invalid')) validate();
  });
  field._validate = validate;
  return validate;
}

function validateAll(fieldIds) {
  let allOk = true;
  fieldIds.forEach(id => {
    const el = document.getElementById(id);
    if (el && el._validate) {
      if (!el._validate()) allOk = false;
    }
  });
  return allOk;
}

function clearValidation(...ids) {
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.classList.remove('invalid','valid'); }
    const err = document.getElementById(id+'_err');
    if (err) err.classList.remove('show');
  });
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  if (loading) btn.classList.add('btn-loading');
  else btn.classList.remove('btn-loading');
}

  showModal('Start Operation','<div style="display:grid;gap:12px">'+
    '<div><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">Actual Start Time</label>'+
    `<input type="datetime-local" id="dlg_start" value="${nowLocal.replace(' ','T')}" style="width:100%"></div>`+

    '</div>',

      <option value="7">Next 7 Days</option>

      html+=`<div class="today-machine-block">
        <div class="today-machine-title"><span>${dayLabel}</span><span class="opcount">${dops.length} op${dops.length>1?'s':''}</span></div>`;
      dops.forEach(op=>{
        const workMins=op.work_time_mins||(op.work_time_hrs*60);
        const setupMins=op.setup_time_mins||0;
        html+=`<div class="today-op-row">
          <div class="today-op-info">
            <div class="today-op-title">
              <span class="jobnum">${op.order_label||op.job_number}</span>
              ${op.priority?'<span class="badge badge-urgent">🚨</span>':''}
              <span class="opname">${op.op_name}</span>

          </div>

let expandedJobId=null;

let jobNextOps = {};  // populated by loadAll extended

async function renderJobs(){
  await loadAll();

  document.getElementById('topbarActions').innerHTML=`
    <button class="btn btn-secondary" onclick="scheduleAll()">⚡ Schedule All</button>
    <button class="btn btn-primary" onclick="openJobModal()">+ New Job</button>`;

  renderJobsTable();
}

function renderJobsTable(){
  const sorted=[...allJobs].sort((a,b)=>a.critical_ratio-b.critical_ratio);

  // Group: orders first (grouped), then standalone
  const orderGroups = {};
  const standalone  = [];
  sorted.forEach(j=>{
    if(j.order_id){
      if(!orderGroups[j.order_id]) orderGroups[j.order_id]=[];
      orderGroups[j.order_id].push(j);
    } else { standalone.push(j); }
  });

  // Status filter
  const sf = document.getElementById('jobStatusFilter')?.value || '';
  const tf = (document.getElementById('jobTextFilter')?.value || '').toLowerCase();

  function matchJob(j){
    if(sf && j.status !== sf) return false;
    if(tf && !`${j.job_number} ${j.customer_name} ${j.product_type} ${j.product_size}`.toLowerCase().includes(tf)) return false;
    return true;
  }

  let html = `<div class="card">
    <div class="card-hdr" style="flex-wrap:wrap;gap:8px">
      <div class="card-title">Jobs (${allJobs.length})</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select id="jobStatusFilter" onchange="renderJobsTable()" style="width:130px">
          <option value="">All Status</option>
          <option value="pending">Pending</option>
          <option value="scheduled">Scheduled</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
        <input id="jobTextFilter" placeholder="Search…" oninput="renderJobsTable()" style="width:180px">
        <label style="font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer">
          <input type="checkbox" id="jobGroupToggle" onchange="renderJobsTable()" ${jobGroupByOrder?'checked':''}> Group by Order
        </label>
      </div>
    </div>`;

  const doGroup = document.getElementById('jobGroupToggle')?.checked ?? jobGroupByOrder;
  jobGroupByOrder = doGroup;

  if(doGroup){
    // Render order groups
    Object.entries(orderGroups).forEach(([ordId, pieces])=>{
      const visiblePieces = pieces.filter(matchJob);
      if(!visiblePieces.length) return;
      const order = allOrders.find(o=>o.id==ordId);
      const done  = pieces.filter(p=>p.status==='completed').length;
      const pct   = Math.round(done/pieces.length*100);
      const lastFinish = pieces.map(p=>p.scheduled_finish).filter(Boolean).sort().pop();
      const anyLate = pieces.some(p=>p.is_late);
      html += `<div style="margin-bottom:6px">
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px 8px 0 0;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span class="mono" style="color:var(--accent);font-weight:600;font-size:13px">${order?.order_number||'ORD-?'}</span>
          <span style="font-size:12px;color:var(--muted)">${pieces[0]?.customer_name} · ${pieces[0]?.product_type} · ${pieces.length} pcs</span>
          <div class="prog-bar" style="width:80px;flex-shrink:0"><div class="prog-fill" style="width:${pct}%"></div></div>
          <span style="font-size:11px;color:var(--muted)">${done}/${pieces.length} done</span>
          ${lastFinish?`<span style="font-size:11px;color:${anyLate?'var(--red)':'var(--muted)'}">Finish: ${fmtD(lastFinish)}${anyLate?' ⚠':''}</span>`:''}
          <button class="btn btn-ghost" style="font-size:11px;margin-left:auto" onclick="bulkOverrideOrder(${ordId})">✏ Edit All Times</button>
        </div>
        ${visiblePieces.map(j=>jobRowHTML(j,true)).join('')}
      </div>`;
    });
    // Standalone
    const visSA = standalone.filter(matchJob);
    if(visSA.length){
      if(Object.keys(orderGroups).length) html+=`<div style="font-size:11px;color:var(--muted);margin:12px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.05em">Standalone Jobs</div>`;
      visSA.forEach(j=>{ html+=jobRowHTML(j,false); });
    }
  } else {
    sorted.filter(matchJob).forEach(j=>{ html+=jobRowHTML(j,false); });
  }

  if(!allJobs.filter(matchJob).length){
    html+=`<div class="empty">No jobs match the filter.</div>`;
  }
  html+='</div>';
  document.getElementById('content').innerHTML=html;
  if(expandedJobId) setTimeout(()=>expandJob(expandedJobId,true),80);
}

let jobGroupByOrder = true;

function jobRowHTML(j, inGroup=false){
  const pct = j.ops_total ? Math.round(j.ops_done/j.ops_total*100) : 0;
  const nxt = jobNextOps[j.id];
  const nextOpHtml = nxt
    ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">
        ${nxt.status==='in_progress'?'▶':'⏱'} <span style="color:var(--accent)">${nxt.op_name}</span> · ${nxt.wc_name}${nxt.scheduled_start?' · '+fmtDT(nxt.scheduled_start):''}
       </div>`
    : '';
  const blockHtml = j.status==='paused' ? `<span title="Paused" style="color:var(--amber)">⏸</span>` :
                    (j.ops_total>0 && j.ops_done<j.ops_total && !nxt && j.status!=='completed') ? `<span title="Unscheduled ops" style="color:var(--orange)">⚠</span>` : '';

  const radius = inGroup ? '0' : '8px';
  return `<div id="jblock_${j.id}" style="border:1px solid var(--border);border-radius:${radius};margin-bottom:${inGroup?'0':'8px'};background:var(--card);${inGroup?'border-top:none;border-radius:0;':''}">
    <div class="job-main-row" id="jrow_${j.id}" onclick="expandJob(${j.id})" style="cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <svg class="expand-icon" id="jicon_${j.id}" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:14px;height:14px;flex-shrink:0;transition:transform .15s"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>

      <div style="flex:0 0 110px;min-width:0">
        <div class="mono" style="font-size:12px;font-weight:600">${j.job_number}</div>
        ${j.is_frozen?'<span class="badge" style="background:var(--blue-soft,#dbeafe);color:var(--blue,#1d4ed8);margin-left:4px" title="Frozen — excluded from Schedule All">🔒 Frozen</span>':""}
        ${j.piece_number?`<div style="font-size:10px;color:var(--muted)">Piece ${j.piece_number}</div>`:''}
      </div>

      ${inGroup?'':`<div style="flex:1 1 120px;min-width:0;font-size:12px">${j.customer_name}</div>`}

      <div style="flex:1 1 140px;min-width:0">
        <div style="font-size:12px;font-weight:500">${j.product_type} ${j.product_size||''}</div>
        ${nextOpHtml}
      </div>

      <div style="flex:0 0 80px;text-align:center">
        <div class="mono" style="font-size:11px;color:var(--muted)">Due</div>
        <div class="mono" style="font-size:12px">${fmtD(j.due_date)}</div>
      </div>

      <div style="flex:0 0 90px;text-align:center">
        <div class="mono" style="font-size:11px;color:var(--muted)">Finish</div>
        <div class="mono" style="font-size:12px;color:${j.is_late?'var(--red)':j.scheduled_finish?'var(--text)':'var(--muted)'}">${j.scheduled_finish?fmtD(j.scheduled_finish):'—'}${j.is_late?' ⚠':''}</div>
      </div>

      <div style="flex:0 0 70px">${sBadge(j.status)} ${blockHtml}</div>

      <div style="flex:0 0 90px">${crBar(j.critical_ratio)}</div>

      <div style="flex:0 0 100px">
        <div style="font-size:10px;color:var(--muted);margin-bottom:2px">${j.ops_done}/${j.ops_total} ops</div>
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>

      <div style="flex:0 0 auto;display:flex;gap:5px;flex-wrap:wrap" onclick="event.stopPropagation()">
        ${j.priority_flag?'':'<button class="btn btn-danger btn-icon" title="Urgent" onclick="setUrgent('+j.id+')">🚨</button>'}
        <button class="btn btn-ghost btn-icon" title="${j.is_frozen?'Unfreeze — allow rescheduling':'Freeze — skip in Schedule All'}" onclick="toggleFreeze(${j.id})">${j.is_frozen?'🔓':'🔒'}</button>
        <button class="btn btn-ghost" style="font-size:11px;padding:3px 8px" onclick="openJobModal(${j.id})">Edit</button>
        <button class="btn btn-ghost btn-icon" title="Duplicate" onclick="duplicateJob(${j.id})">⧉</button>
        ${j.status==='pending'?`<button class="btn btn-secondary" style="font-size:11px;padding:3px 8px" onclick="scheduleJob(${j.id})">Schedule</button>`:''}
        <button class="btn btn-danger btn-icon" title="Delete" onclick="delJob(${j.id})">✕</button>
      </div>
    </div>
    <div class="job-detail-panel" id="jpanel_${j.id}"></div>
  </div>`;
}

async function expandJob(id,keepOpen=false){
  const panel=document.getElementById(`jpanel_${id}`);
  const icon=document.getElementById(`jicon_${id}`);
  if(!panel||!icon) return;
  if(panel.classList.contains('open')&&!keepOpen){
    panel.classList.remove('open');icon.style.transform='';expandedJobId=null;return;
  }
  document.querySelectorAll('.job-detail-panel.open').forEach(p=>p.classList.remove('open'));
  document.querySelectorAll('.expand-icon').forEach(i=>i.style.transform='');
  panel.innerHTML=`<div style="color:var(--muted);font-size:12px;padding:8px 14px">Loading...</div>`;
  panel.classList.add('open');icon.style.transform='rotate(90deg)';expandedJobId=id;
  const j=await api('GET',`/api/jobs/${id}`);
  const ops=j.scheduled_ops||[];
  panel.innerHTML=`
    <div class="detail-grid">
      <div class="detail-item"><div class="dl">PO Number</div><div class="dv mono" style="font-size:12px">${j.po_number||'—'}</div></div>
      <div class="detail-item"><div class="dl">Size / Variant</div><div class="dv" style="font-size:12px">${j.product_size}${j.product_variant?' · '+j.product_variant:''}</div></div>
      <div class="detail-item"><div class="dl">Est. Finish</div><div class="dv mono" style="font-size:12px;color:${j.is_late?'var(--red)':'inherit'}">${fmtD(j.scheduled_finish)||'—'}${j.is_late?' ⚠':''}</div></div>
      <div class="detail-item"><div class="dl">Material Ready</div><div class="dv mono" style="font-size:12px">${j.material_ready_date?fmtD(j.material_ready_date):'Immediate'}</div></div>
      <div class="detail-item"><div class="dl">Not Before</div><div class="dv mono" style="font-size:12px">${j.not_before?fmtDT(j.not_before):'—'}</div></div>

      ${j.notes?`<div class="detail-item" style="grid-column:1/-1"><div class="dl">Notes</div><div class="dv" style="font-size:12px;color:var(--muted)">${j.notes}</div></div>`:''}
    </div>

    <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px">Operations</div>

      return`<div class="${cls}">
        <span class="mono" style="font-size:11px;color:var(--muted)">${op.sequence}</span>

        <span style="font-size:11px;color:var(--muted);font-family:var(--mono)">${op.scheduled_start?fmtDT(op.scheduled_start)+' → '+fmtDT(op.scheduled_end):'Not scheduled'}</span>

async function openJobModal(editId){
  await loadAll();
  let editJob = null;
  if(editId){ editJob = await api('GET', `/api/jobs/${editId}`); }

  const nb  = new Date(istNow().getTime() + 30*60000);
  const defNB  = nb.toISOString().slice(0,16);

function onCustomerChange(){
  const sel = document.getElementById('f_cust_id');
  const txt = document.getElementById('f_cust');
  if(!sel || !txt) return;
  if(sel.value === '__new__'){
    txt.style.display = 'block';
    txt.value = '';
    txt.placeholder = 'Type new customer name';
    txt.focus();
  } else {
    txt.style.display = 'none';
    txt.value = sel.value ? (allCustomers.find(c=>c.id==sel.value)?.name||'') : '';
  }
}

function filterRoutingsByType(ptype){
  const sel = document.getElementById('f_routing');
  if(!sel) return;
  const cur = sel.value;
  const filtered = ptype
    ? allRoutings.filter(r=>r.product_type===ptype)
    : allRoutings;
  // If no routings match this product type, show all routings
  const toShow = filtered.length > 0 ? filtered : allRoutings;
  sel.innerHTML = '<option value="">— Select a routing template —</option>' +
    toShow.map(r=>`<option value="${r.id}"${r.id==cur?' selected':''}>${r.name} (${r.product_type})</option>`).join('');
  if(!toShow.find(r=>r.id==cur)){
    sel.value=''; jobFormOps=[];
    const w=document.getElementById('jobOpsWrap');
    if(w) w.innerHTML='<div style="color:var(--muted);font-size:12px;padding:4px 0">Select a routing template above</div>';
  }
}

async function loadJobOps(){
  const rid=parseInt(document.getElementById('f_routing')?.value);
  if(!rid){document.getElementById('jobOpsWrap').innerHTML='<div style="color:var(--muted);font-size:12px;padding:4px 0">Select a routing template</div>';return;}
  const rt=await api('GET',`/api/routings/${rid}`);
  if(!rt.operations.length){
    document.getElementById('jobOpsWrap').innerHTML='<div style="color:var(--red);font-size:12px;padding:7px 10px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:5px">⚠ This routing has no operations. Add operations to the routing first.</div>';
    jobFormOps=[];return;
  }
  const matEl=document.getElementById('f_mat');
  if(matEl&&!matEl.value&&rt.material_lead_days){
    const md=new Date(istNow().getTime()+(rt.material_lead_days*86400000));
    matEl.value=md.toISOString().slice(0,16);
  }
  jobFormOps=rt.operations.map(op=>({
    operation_id:op.id,name:op.name,wc_name:op.work_center_name,machine_type:op.machine_type||'',
    work_center_id:op.work_center_id,
    setup_time_mins:op.setup_time_mins,
    work_time_mins:op.work_time_mins!=null?op.work_time_mins:(op.work_time_hrs||0)*60,
    work_time_hrs:op.work_time_hrs,
    is_optional:op.is_optional,included:true
  }));
  renderJobOpsTable();
}

function renderJobOpsTable(){
  if(!jobFormOps.length){document.getElementById('jobOpsWrap').innerHTML='<div style="color:var(--muted);font-size:12px">No operations</div>';return;}
  const unit=timeUnitLabel();
  const rows=jobFormOps.map((op,i)=>{
    // work_time_mins is canonical; fall back to hrs*60
    const wMins=op.work_time_mins!=null?op.work_time_mins:((op.work_time_hrs||0)*60);
    const sMins=op.setup_time_mins||0;
    const totMins=sMins+wMins;
    return `
    <tr id="opovrow_${i}" class="${op.included?'':'excluded'}">
      <td><input type="checkbox" id="opchk_${i}" ${op.included?'checked':''} onchange="toggleOp(${i},this.checked)" style="width:14px;height:14px;accent-color:var(--accent)"></td>
      <td class="mono" style="color:var(--muted);text-align:center">${i+1}</td>
      <td style="font-weight:500">${op.name}${op.is_optional?' <span style="font-size:10px;color:var(--muted)">(opt)</span>':''}</td>
      <td style="color:var(--muted);font-family:var(--mono);font-size:11px">${op.wc_name}</td>
      <td><input type="number" id="opsetup_${i}" value="${Math.round(sMins)}" min="0" step="5" onchange="recalcOp(${i})" ${op.included?'':'disabled'} title="Setup time in minutes"></td>
      <td><input type="number" id="opwork_${i}" value="${Math.round(wMins)}" min="0" step="10" onchange="recalcOp(${i})" ${op.included?'':'disabled'} title="Work time in minutes"></td>
      <td id="optot_${i}" class="mono" style="color:var(--muted);text-align:right">${fmtTotal(totMins)}</td>
    </tr>`;
  }).join('');
  document.getElementById('jobOpsWrap').innerHTML=`
    <table class="op-ov-table">
      <thead><tr><th>✓</th><th>#</th><th>Operation</th><th>Machine</th><th>Setup (min)</th><th>Work (min)</th><th>Total</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="5" style="padding:7px 8px;font-size:11px;color:var(--muted)">Total working time:</td>
      <td colspan="2" id="opGrandTot" class="mono" style="font-size:12px;font-weight:600;padding:7px 8px;color:var(--text)"></td></tr></tfoot>
    </table>
    <div style="margin-top:10px">
      <button class="btn btn-ghost" style="font-size:12px" onclick="promptSaveAsRouting()" title="Save these operations as a reusable routing template">💾 Save as Routing Template</button>
    </div>`;
  updateGrandTotal();
}

function toggleOp(i,checked){
  jobFormOps[i].included=checked;
  document.getElementById(`opovrow_${i}`).className=checked?'':'excluded';
  [`opsetup_${i}`,`opwork_${i}`].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=!checked;});
  updateGrandTotal();
}
function recalcOp(i){
  const s=parseFloat(document.getElementById(`opsetup_${i}`)?.value)||0;
  const w=parseFloat(document.getElementById(`opwork_${i}`)?.value)||0;
  // both s and w are in MINUTES
  jobFormOps[i].setup_time_mins=s;
  jobFormOps[i].work_time_mins=w;
  jobFormOps[i].work_time_hrs=w/60;
  const el=document.getElementById(`optot_${i}`);if(el)el.textContent=fmtTotal(s+w);
  updateGrandTotal();
}
function updateGrandTotal(){
  const tot=jobFormOps.filter(o=>o.included).reduce((s,o,i)=>{
    const sv=parseFloat(document.getElementById(`opsetup_${i}`)?.value)??o.setup_time_mins;
    const wv=parseFloat(document.getElementById(`opwork_${i}`)?.value)??(o.work_time_mins!=null?o.work_time_mins:(o.work_time_hrs||0)*60);
    return s+sv+wv; // both in minutes
  },0);
  const el=document.getElementById('opGrandTot');
  if(el) el.textContent=`${fmtTotal(tot)} ≈ ${(tot/600).toFixed(1)} days`;
}

async function saveJob(editId){
  // Run all validations first
  const fieldIds=['f_cust','f_due','f_size','f_routing','f_nb'];
  const valid=validateAll(fieldIds);
  // Also check job number async uniqueness
  const jnEl=document.getElementById('f_jobnum');
  if(jnEl?.classList.contains('invalid')){
    toast('Fix the job number — it already exists','error');return;
  }
  if(!valid){
    toast('Please fix the highlighted fields before saving','error');
    return;
  }
  if(jobFormOps.length===0){toast('Routing has no operations — fix the routing first','error');return;}
  const ovs=jobFormOps.map((op,i)=>({
    operation_id:op.operation_id,
    setup_time_mins:parseFloat(document.getElementById(`opsetup_${i}`)?.value)??op.setup_time_mins,
    work_time_mins:parseFloat(document.getElementById(`opwork_${i}`)?.value)??(op.work_time_mins!=null?op.work_time_mins:(op.work_time_hrs||0)*60),
    work_time_hrs:(parseFloat(document.getElementById(`opwork_${i}`)?.value)??(op.work_time_mins!=null?op.work_time_mins:(op.work_time_hrs||0)*60))/60,
    included:document.getElementById(`opchk_${i}`)?.checked??op.included,
  }));
  const custSel = document.getElementById('f_cust_id');
  const custIdVal = custSel?.value;
  const custIdNum = (custIdVal && custIdVal !== '__new__' && custIdVal !== '') ? parseInt(custIdVal) : null;
  const custNameVal = document.getElementById('f_cust').value.trim();
  const data={
    job_number:document.getElementById('f_jobnum').value.trim()||null,
    po_number:document.getElementById('f_po').value.trim(),
    customer_id: custIdNum,
    customer_name: custNameVal,
    total_price: document.getElementById('f_price').value || null,
    product_type:document.getElementById('f_ptype').value,
    product_size:document.getElementById('f_size').value.trim(),
    product_variant:document.getElementById('f_variant').value.trim(),
    due_date: dtFieldVal('f_due_d','f_due_t'),
    routing_id:parseInt(document.getElementById('f_routing').value)||null,
    priority_flag:document.getElementById('f_urgent').checked,
    notes:document.getElementById('f_notes').value,
    not_before: dtFieldVal('f_nb_d','f_nb_t')||null,
    material_ready_date: dtFieldVal('f_mat_d','f_mat_t')||null,
    op_overrides:ovs,
  };
  setLoading('saveJobBtn',true);
  try{
    if(editId&&editId!=='null') await api('PUT',`/api/jobs/${editId}`,data);
    else await api('POST','/api/jobs',data);
    toast(editId&&editId!=='null'?'Job updated!':'Job created!');
    closeModal();await loadAll();showPage('jobs');
  }catch(e){
    toast(e.message,'error');
  }finally{
    setLoading('saveJobBtn',false);
  }
}

function promptSaveAsRouting(){
  if(!jobFormOps.length){toast('No operations to save','error');return;}
  const ptype=document.getElementById('f_ptype')?.value||'';
  showModal('Save as Routing Template',
    `<div style="display:grid;gap:12px">
      <div><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">Routing Name <span style="color:var(--red)">*</span></label>
        <input type="text" id="dlg_rname" placeholder="e.g. Punch — Custom 600x1200 Rustic" style="width:100%"></div>
      <div><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">Product Type</label>
        <input type="text" id="dlg_rtype" value="${ptype}" style="width:100%"></div>
      <div><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">Description (optional)</label>
        <input type="text" id="dlg_rdesc" placeholder="Brief description…" style="width:100%"></div>
      <div style="font-size:12px;color:var(--muted)">Will save ${jobFormOps.filter(o=>o.included).length} included operations with their current times.</div>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="doSaveAsRouting()">💾 Save Routing</button>`
  );
}

async function doSaveAsRouting(){
  const name=(document.getElementById('dlg_rname')?.value||'').trim();
  if(!name){toast('Routing name is required','error');return;}
  const ptype=(document.getElementById('dlg_rtype')?.value||'').trim();
  const desc=(document.getElementById('dlg_rdesc')?.value||'').trim();
  // Collect current op values from form inputs
  const ops=jobFormOps.map((op,i)=>{
    if(!op.included) return null;
    const sMins=parseFloat(document.getElementById(`opsetup_${i}`)?.value)||op.setup_time_mins||0;
    const wMins=parseFloat(document.getElementById(`opwork_${i}`)?.value)||(op.work_time_mins!=null?op.work_time_mins:(op.work_time_hrs||0)*60);
    return {
      name:op.name,
      work_center_id:op.work_center_id,
      machine_setup_mins:0, job_setup_mins:sMins, setup_time_mins:sMins,
      work_time_mins:wMins, work_time_hrs:wMins/60,
      is_optional:op.is_optional||false,
    };
  }).filter(Boolean);
  try{
    const r=await api('POST','/api/routings',{name,product_type:ptype||'Custom',description:desc,operations:ops,is_active:true});
    toast(`Routing "${r.name}" saved!`);
    closeModal();
    await loadAll(); // refresh routing list
  }catch(e){toast(e.message,'error');}
}

async function renderSchedule(){
  const alreadyMounted = !!document.getElementById('ganttWrap');

  // Only rebuild the shell (toolbar + containers) if we're navigating in fresh
  if(!alreadyMounted){
    buildGanttShell();
    // Show cached data immediately so there is zero blank time
    if(ganttData && ganttData.length){
      try{ renderGantt(ganttData,ganttView,ganttFilter); }catch(e){ console.error('Gantt render error:',e); }
    }
  } else {
    // Already on the page — just update the topbar button, leave the chart untouched
    document.getElementById('topbarActions').innerHTML=`<button class="btn btn-secondary" onclick="scheduleAll()">⚡ Reschedule All</button>`;
  }

  // Background refresh — never rebuilds shell, only updates chart if data changed
  try{
    const fresh = await api('GET','/api/gantt');
    const changed = JSON.stringify(fresh) !== JSON.stringify(ganttData);
    ganttData = fresh;
    if(changed || !alreadyMounted){
      try{ renderGantt(ganttData,ganttView,ganttFilter); }catch(e){ console.error('Gantt render error:',e); }
    }
  }catch(e){
    if(!ganttData || !ganttData.length){
      const w=document.getElementById('ganttWrap');
      if(w) w.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted)">Could not load schedule data.</div>';
    }
  }
}

function setGanttView(v){
  ganttView=v;
  document.querySelectorAll('.gantt-view-btn').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('gv_'+v);
  if(btn) btn.classList.add('active');
  renderGantt(ganttData,ganttView,ganttFilter);
}
function applyGanttFilter(val){ganttFilter=val.toLowerCase();renderGantt(ganttData,ganttView,ganttFilter);}

function renderGantt(data,view,filter){
  const labelsEl = document.getElementById('ganttLabels');
  const timeEl   = document.getElementById('ganttWrap');
  if(!timeEl) return;

  // Theme color constants — read all CSS vars once, works for both light & dark
  const _cs2    = getComputedStyle(document.documentElement);
  const isDark  = document.documentElement.getAttribute('data-theme') !== 'light';
  const ganttBg     = (_cs2.getPropertyValue('--bg').trim())      || (isDark ? '#0f1115' : '#f6f7f9');
  const ganttSurf   = (_cs2.getPropertyValue('--surface').trim()) || (isDark ? '#171a21' : '#ffffff');
  const ganttBorder = (_cs2.getPropertyValue('--border').trim())  || (isDark ? '#262b36' : '#e5e7eb');
  const ganttText   = (_cs2.getPropertyValue('--muted').trim())   || '#7a8295';
  const ganttLabel  = (_cs2.getPropertyValue('--text').trim())    || (isDark ? '#e9ecf3' : '#1d2128');
  const ganttSub    = (_cs2.getPropertyValue('--text-soft').trim())|| (isDark ? '#b9bfcd' : '#3f4654');
  // Row alternating bg: subtle tint that works on both themes
  const ganttRowEven = isDark ? 'rgba(255,255,255,.018)' : 'rgba(0,0,0,.025)';
  const ganttRowBdr  = isDark ? '#1a1f2e' : '#e5e7eb';
  const ganttHdrBdr  = isDark ? '#2a2f3d' : '#d1d5db';
  const ganttDayLbl  = isDark ? '#4a5568' : '#9ca3af';
  const ganttWkend   = isDark ? 'rgba(255,255,255,.006)' : 'rgba(0,0,0,.03)';
  const ganttOffHr   = isDark ? 'rgba(0,0,0,.08)'        : 'rgba(0,0,0,.04)';
  const ganttGloss   = isDark ? 'rgba(255,255,255,.07)'   : 'rgba(255,255,255,.5)';
  const ganttProg    = isDark ? 'rgba(255,255,255,.6)'    : 'rgba(255,255,255,.9)';
  const ganttBarTxt2 = isDark ? 'rgba(255,255,255,.75)'   : 'rgba(255,255,255,.9)';

  if(!data||!data.length){
    if(labelsEl) labelsEl.innerHTML='';
    timeEl.innerHTML='<div style="padding:48px;text-align:center;color:var(--muted)">No scheduled operations. Run Schedule All first.</div>';
    return;
  }

  // Apply filters
  const todayOnly = document.getElementById('ganttTodayOnly')?.checked;
  const todayStr  = new Date().toISOString().slice(0,10);
  let fd = todayOnly ? data.filter(op=>op.start&&op.start.slice(0,10)===todayStr) : data;
  if(filter) fd = fd.filter(op=>
    (op.job_number||'').toLowerCase().includes(filter)||
    (op.customer||'').toLowerCase().includes(filter)||
    (op.op_name||'').toLowerCase().includes(filter)||
    (op.wc_name||'').toLowerCase().includes(filter)||
    (op.worker_name||'').toLowerCase().includes(filter));
  if(!fd.length){
    if(labelsEl) labelsEl.innerHTML='';
    timeEl.innerHTML=`<div style="padding:48px;text-align:center;color:var(--muted)">No results for "${filter||'today'}"</div>`;
    return;
  }

  // Row grouping
  const rowKeyFn = view==='worker' ? op=>(op.worker_name||'⚠ Unassigned') :
                   view==='job'    ? op=>op.job_number : op=>op.wc_name;
  const rowKeys  = [...new Set(fd.map(rowKeyFn))].sort();

  // Time range
  const minD = new Date(Math.min(...fd.map(op=>new Date(op.start))));
  const maxD = new Date(Math.max(...fd.map(op=>new Date(op.end))));
  minD.setHours(0,0,0,0);
  const days=[]; {let c=new Date(minD);while(c<=maxD){days.push(new Date(c));c=new Date(c.getTime()+86400000);}}

  // Layout constants
  const ROW_H  = 52;   // px per row — taller for readability
  const HH     = 64;   // header height
  const PPH    = 60;   // px per hour — wider for readability
  const W      = Math.max(800, (maxD-minD)/3600000*PPH);
  const H      = HH + rowKeys.length*ROW_H + 4;

  // ── STICKY LEFT LABELS (HTML, not SVG) ──
  if(labelsEl){
    const totalH = HH + rowKeys.length*ROW_H;
    let labHtml = `<div style="height:${HH}px;border-bottom:1px solid ${ganttHdrBdr};display:flex;align-items:flex-end;padding:0 10px 8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:${ganttText}">
      ${view==='machine'?'Machine':view==='worker'?'Worker':'Job'}
    </div>`;
    rowKeys.forEach((key,i)=>{
      const isEven = i%2===0;
      const isUnassigned = key==='⚠ Unassigned';
      const opCount = fd.filter(op=>rowKeyFn(op)===key).length;
      const subLabel = view==='job' ? (allJobs.find(j=>j.job_number===key)?.customer_name||'') :
                       view==='machine' ? (allMachines.find(m=>m.name===key)?.machine_type||'') : '';
      labHtml += `<div style="height:${ROW_H}px;background:${isEven?ganttRowEven:'transparent'};border-bottom:1px solid ${ganttRowBdr};display:flex;flex-direction:column;justify-content:center;padding:0 10px;box-sizing:border-box">
        <div style="font-size:12px;font-weight:500;color:${isUnassigned?'#f97316':ganttLabel};white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${key}">${key}</div>
        ${subLabel?`<div style="font-size:10px;color:${ganttText};margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${subLabel}</div>`:''}
        <div style="font-size:10px;color:var(--accent);margin-top:1px">${opCount} op${opCount!==1?'s':''}</div>
      </div>`;
    });
    labelsEl.innerHTML = labHtml;
    labelsEl.style.height = totalH + 'px';
    labelsEl.style.overflowY = 'hidden';
  }

  // Sync scroll between labels and timeline
  timeEl.onscroll = ()=>{ if(labelsEl) labelsEl.style.marginTop = -timeEl.scrollTop + 'px'; };

  // ── TIMELINE SVG ──
    // Read theme colors once before building SVG
  const _cs = getComputedStyle(document.documentElement);
  // Re-use the ganttBg/ganttBorder/ganttText vars already defined above
  let s = `<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;min-width:${W}px">
  <rect width="${W}" height="${H}" fill="${ganttBg}"/>`;

  // Day columns
  days.forEach(d=>{
    const x   = (d-minD)/3600000*PPH;
    const dow = d.getDay();
    const isToday = d.toDateString()===new Date().toDateString();

    if(dow===0||dow===6) s+=`<rect x="${x}" y="${HH}" width="${24*PPH}" height="${H-HH}" fill="${ganttWkend}"/>`;
    if(isToday)          s+=`<rect x="${x}" y="0" width="${24*PPH}" height="${HH}" fill="rgba(245,158,11,.06)"/>`;
    s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${ganttBorder}" stroke-width="1"/>`;

    // Day header
    const dl = d.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'});
    s+=`<text x="${x+6}" y="20" font-family="IBM Plex Mono,monospace" font-size="11" fill="${isToday?'#f59e0b':ganttDayLbl}" font-weight="${isToday?'bold':'normal'}">${dl}</text>`;

    // Hour marks every 2 hours (8,10,12,14,16,18,20)
    for(let h=8;h<=20;h+=2){
      const xh = (new Date(d.getFullYear(),d.getMonth(),d.getDate(),h)-minD)/3600000*PPH;
      s+=`<line x1="${xh}" y1="${HH-10}" x2="${xh}" y2="${H}" stroke="${ganttBorder}" stroke-width="0.5" stroke-dasharray="1,5"/>`;
      if(h>8&&h<20) s+=`<text x="${xh+2}" y="${HH-2}" font-family="IBM Plex Mono,monospace" font-size="9" fill="${ganttText}">${h}h</text>`;
    }

    // Shift boundary lines
    const mkLine=(hr,col,dash)=>{
      const xm=(new Date(d.getFullYear(),d.getMonth(),d.getDate(),hr)-minD)/3600000*PPH;
      s+=`<line x1="${xm}" y1="${HH}" x2="${xm}" y2="${H}" stroke="${col}" stroke-width="1" stroke-dasharray="${dash}" opacity="0.5"/>`;
    };
    mkLine(8, '#10b981','4,4');
    mkLine(12,'#374151','2,6');
    mkLine(14,'#374151','2,6');
    mkLine(dow===3?14:20,'#6366f1','4,4');

    // Off-hours shading
    const shade=(h1,h2)=>{
      const x1=(new Date(d.getFullYear(),d.getMonth(),d.getDate(),h1)-minD)/3600000*PPH;
      const x2=(new Date(d.getFullYear(),d.getMonth(),d.getDate(),h2)-minD)/3600000*PPH;
      if(x2>x1) s+=`<rect x="${x1}" y="${HH}" width="${x2-x1}" height="${H-HH}" fill="${ganttOffHr}"/>`;
    };
    shade(0,8); shade(12,14); shade(dow===3?14:20,24);
  });

  // Row backgrounds
  rowKeys.forEach((key,i)=>{
    const y = HH+i*ROW_H;
    s+=`<rect x="0" y="${y}" width="${W}" height="${ROW_H}" fill="${i%2===0?ganttRowEven:'transparent'}"/>`;
    s+=`<line x1="0" y1="${y+ROW_H}" x2="${W}" y2="${y+ROW_H}" stroke="${ganttBorder}" stroke-width="1"/>`;
  });

  // Due date lines
  [...new Set(fd.map(op=>op.due_date).filter(Boolean))].forEach(dd=>{
    const dx=(new Date(dd)-minD)/3600000*PPH;
    if(dx>0&&dx<W){
      s+=`<line x1="${dx}" y1="${HH}" x2="${dx}" y2="${H}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5"/>`;
      s+=`<text x="${dx+3}" y="${HH+16}" font-family="IBM Plex Mono,monospace" font-size="9" fill="#ef4444" opacity="0.7">DUE</text>`;
    }
  });

  // NOW line
  const nowX=(new Date()-minD)/3600000*PPH;
  if(nowX>0&&nowX<W){
    s+=`<line x1="${nowX}" y1="0" x2="${nowX}" y2="${H}" stroke="#f59e0b" stroke-width="2" opacity="0.95"/>`;
    s+=`<rect x="${nowX}" y="1" width="32" height="20" rx="4" fill="#f59e0b"/>`;
    s+=`<text x="${nowX+4}" y="15" font-family="IBM Plex Sans,sans-serif" font-size="10" fill="#000" font-weight="bold">NOW</text>`;
  }

  // ── OPERATION BARS ──
  fd.forEach(op=>{
    const ri = rowKeys.indexOf(rowKeyFn(op));
    if(ri<0) return;

    const xStart = (new Date(op.start)-minD)/3600000*PPH;
    const xEnd   = (new Date(op.end)-minD)/3600000*PPH;
    const bw     = Math.max(8, xEnd-xStart-2);
    const y      = HH + ri*ROW_H;
    const barY   = y + 6;
    const barH   = ROW_H - 12;

    // Color logic
    const col = op.is_late||op.priority ? '#ef4444' :
                op.status==='completed'  ? '#10b981' :
                op.status==='in_progress'? '#f59e0b' :
                view==='worker'          ? '#8b5cf6' : '#3b82f6';

    // Shadow
    s+=`<rect x="${xStart+2}" y="${barY+3}" width="${bw}" height="${barH}" rx="5" fill="rgba(0,0,0,.15)"/>`;
    // Bar
    s+=`<rect x="${xStart}" y="${barY}" width="${bw}" height="${barH}" rx="5" fill="${col}" opacity="0.9"><title>${
      view==='machine'?`${op.job_number} — ${op.op_name}\n${op.customer||''}\n${fmtDT(op.start)} → ${fmtDT(op.end)}${op.worker_name?' | 👷 '+op.worker_name:''}${op.is_late?' | ⚠ LATE':''}`:
      view==='worker' ?`${op.job_number} — ${op.op_name}\nMachine: ${op.wc_name}\n${fmtDT(op.start)} → ${fmtDT(op.end)}${op.is_late?' | ⚠ LATE':''}`:
                       `${op.op_name} | ${op.wc_name}\n${op.worker_name?'👷 '+op.worker_name+'\n':''}${fmtDT(op.start)} → ${fmtDT(op.end)}${op.is_late?' | ⚠ LATE':''}`
    }</title></rect>`;
    // Top gloss
    s+=`<rect x="${xStart}" y="${barY}" width="${bw}" height="${Math.floor(barH/2)}" rx="5" fill="${ganttGloss}"/>`;

    // Progress bar (in_progress)
    if(op.status==='in_progress'&&op.actual_start){
      const elapsed=(new Date()-new Date(op.actual_start))/3600000*PPH;
      const pw=Math.min(bw,Math.max(0,elapsed));
      s+=`<rect x="${xStart}" y="${barY+barH-4}" width="${pw}" height="4" rx="2" fill="${ganttProg}"/>`;
    }

    // ── TEXT — only if bar is wide enough ──
    const textX = xStart + 8;
    if(bw >= 120){
      // Two lines of text
      const line1 = view==='job' ? op.op_name : `${op.job_number}: ${op.op_name}`;
      const line2 = view==='machine' ? (op.worker_name?`👷 ${op.worker_name}`:'') :
                    view==='worker'  ? op.wc_name : op.customer||'';
      const maxChars = Math.floor((bw-16)/7);
      const l1 = line1.length>maxChars ? line1.slice(0,maxChars-1)+'…' : line1;
      const l2 = (line2||'').length>maxChars ? (line2||'').slice(0,maxChars-1)+'…' : (line2||'');
      s+=`<text x="${textX}" y="${barY+barH/2-(l2?5:0)}" font-family="IBM Plex Sans,sans-serif" font-size="12" fill="#fff" font-weight="500" paint-order="stroke" stroke="#000" stroke-width="3" stroke-linejoin="round">${l1}</text>`;
      if(l2) s+=`<text x="${textX}" y="${barY+barH/2+10}" font-family="IBM Plex Mono,monospace" font-size="10" fill="${ganttBarTxt2}">${l2}</text>`;
    } else if(bw >= 50){
      // Short label only
      const short = (view==='job'?op.op_name:op.job_number).slice(0,6);
      s+=`<text x="${textX}" y="${barY+barH/2+4}" font-family="IBM Plex Sans,sans-serif" font-size="11" fill="#fff" font-weight="500">${short}</text>`;
    }

    // Late badge
    if(op.is_late){
      s+=`<rect x="${xStart+bw-20}" y="${barY+4}" width="18" height="14" rx="3" fill="rgba(239,68,68,.95)"/>`;
      s+=`<text x="${xStart+bw-11}" y="${barY+14}" font-family="IBM Plex Sans,sans-serif" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">!</text>`;
    }
  });

  s+=`</svg>`;
  timeEl.innerHTML = s;

  // Auto-scroll to NOW
  if(nowX>200) setTimeout(()=>{ timeEl.scrollLeft = nowX-200; }, 60);
}


// ── CAPACITY ──
async function renderCapacity(){
  document.getElementById('topbarActions').innerHTML='';
  document.getElementById('content').innerHTML=`<div class="card"><div class="card-hdr"><div class="card-title">Machine Capacity Heatmap</div></div><div class="card-body" id="hmBody">Loading...</div></div>`;
  try{
    const hm=await api('GET','/api/heatmap');
    const machines=Object.keys(hm);
    if(!machines.length){document.getElementById('hmBody').innerHTML='<div class="empty">No data — schedule jobs first</div>';return;}
    const allDates=[...new Set(machines.flatMap(m=>Object.keys(hm[m])))].sort();
    let html=`<div style="overflow-x:auto"><table class="hm-table"><thead><tr><th style="min-width:190px;text-align:left;padding-right:14px">Machine</th>`;
    allDates.forEach(d=>{const dt=new Date(d);html+=`<th>${dt.toLocaleDateString('en-IN',{weekday:'short'})}<br>${dt.getDate()}</th>`;});
    html+=`</tr></thead><tbody>`;
    machines.forEach(m=>{
      html+=`<tr><td style="font-family:var(--mono);font-size:11px;color:var(--muted);padding:3px 14px 3px 0;white-space:nowrap">${m}</td>`;
      allDates.forEach(d=>{
        const hrs=hm[m][d]||0,pct=Math.min(hrs/10,1);
        let bg,tc;
        if(hrs===0){bg='var(--surface)';tc='transparent';}
        else if(pct<0.5){bg=`rgba(59,130,246,${.15+pct*.7})`;tc='#93c5fd';}
        else if(pct<0.8){bg=`rgba(245,158,11,${.25+pct*.6})`;tc='#fcd34d';}
        else{bg=`rgba(239,68,68,${.35+pct*.5})`;tc='#fca5a5';}
        html+=`<td><div class="hm-cell" title="${m}: ${hrs}h" style="background:${bg};color:${tc}">${hrs>0?hrs:''}</div></td>`;
      });
      html+=`</tr>`;
    });
    html+=`</tbody></table></div>`;
    document.getElementById('hmBody').innerHTML=html;
  }catch(e){document.getElementById('hmBody').innerHTML=`<div class="empty">${e.message}</div>`;}
}

        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="btn btn-ghost" onclick="openRoutingModal(${r.id})">Edit</button>
          <button class="btn btn-danger" onclick="delRouting(${r.id})">Delete</button>
        </div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center">
        ${r.operations.map((op,i)=>{
          const opMins=op.setup_time_mins+(op.work_time_mins!=null?op.work_time_mins:(op.work_time_hrs||0)*60);
          return`${i>0?`<span style="color:var(--border2)">→</span>`:''}
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-size:11px">
            <span style="color:var(--muted)">${op.sequence}.</span>
            <strong style="margin-left:2px">${op.name}</strong>
            <span style="color:var(--accent2);margin-left:4px">${op.work_center_name}</span>
            <span style="color:var(--muted);margin-left:4px">${fmtTotal(opMins)}${op.is_optional?' opt':''}</span>
          </div>`;}).join('')}
        ${r.operations.length===0?`<span style="color:var(--muted);font-size:12px;font-style:italic">No operations yet</span>`:''}
      </div>
    </div>`;
  }).join('');
}

function buildMachineOpts(selId){
